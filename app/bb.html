<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="fonts/fonts.css" rel="stylesheet"><title>CEsim Breadboard</title>
<style>
.recdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d93025;margin-right:6px;vertical-align:0}#bRec.on{background:#fde7e7;border-color:#d93025}#bRec.on .recdot{animation:recblink 1s steps(2) infinite}@keyframes recblink{50%{opacity:.2}}
:root{--bg:#e9edf2;--panel:#f7f8fa;--line:#cdd3dc;--text:#1b2230;--dim:#5e6979;--hover:#e1e7ef;--accent:#185fa5;--font:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:13px/1.35 var(--font);overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr 28px;height:100%}
#top{display:flex;flex-wrap:wrap;row-gap:2px;align-items:center;gap:2px;padding:4px 10px;min-height:44px;background:var(--panel);border-bottom:1px solid var(--line);user-select:none}
.logo{flex:none;width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 10px var(--mono);margin-right:6px}
#docname{flex:none;font-weight:600;margin-right:10px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;padding:3px 5px;border-radius:3px}#docname:hover{background:var(--hover)}
.tb{flex:none;height:30px;min-width:30px;padding:0 9px;border:1px solid transparent;border-radius:4px;background:none;color:var(--text);cursor:pointer;font:12.5px var(--font);white-space:nowrap}
.tb:hover{background:var(--hover);border-color:var(--line)}.tb.pri{background:#1f8a3a;color:#fff}.tb.pri:hover{filter:brightness(.93)}.tb.on{background:#dce9f8;border-color:#9dbde4}.tb:disabled{opacity:.4;cursor:default;background:none;border-color:transparent}
.tb kbd{font:10.5px var(--mono);color:var(--dim);margin-left:4px}.tb.pri kbd{color:#d4f5dc}
.sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 6px}
#main{display:grid;grid-template-columns:186px minmax(0,1fr) 270px;min-height:0}
#pal{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:6px 8px 14px;user-select:none}
#pal h3,#side h3{font:600 11px var(--font);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:10px 2px 6px}
.pi{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:none;border-radius:5px;padding:4px 6px;cursor:grab;font:12.5px var(--font);color:var(--text);text-align:left}.pi:hover{background:#fff;border-color:#dde2e9}.pi.on{background:#dce9f8;border-color:#9dbde4}
.pi svg{flex:none;width:30px;height:22px}
#stage{position:relative;overflow:hidden;background:#dfe5ec;background-image:radial-gradient(#c9d1db 1px,transparent 1px);background-size:20px 20px}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#hint{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.92);border:1px solid #dde2e9;border-radius:6px;padding:6px 10px;font-size:12px;color:var(--dim);pointer-events:none;max-width:60%}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}#zoom button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;font-size:15px}
#side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:4px 12px 16px}
.card{background:#fff;border:1px solid #dde2e9;border-radius:8px;padding:9px 10px;margin-bottom:8px}
.card b{font-size:13px}.card .sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.fld{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}.fld label{min-width:62px}
.fld input[type=text],.fld select{flex:1;min-width:90px;height:26px;border:1px solid var(--line);border-radius:4px;padding:0 6px;font:12.5px var(--font);background:#fff}
.fld input[type=range]{flex:1;accent-color:var(--accent)}
.btn{height:26px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text);cursor:pointer;font:12px var(--font)}.btn:hover{background:var(--hover)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.red{color:#b3261e}
.rd{font:12px var(--mono);margin-top:6px;line-height:1.6}.rd span{color:var(--dim);font-family:var(--font)}
.prob{display:flex;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:12px;line-height:1.45}.prob:hover{background:#fff}.prob i{font-style:normal;flex:none}.prob.w i{color:#b07b00}.prob.e i{color:#c62828}
.note{font-size:12px;line-height:1.5;color:#33404f}
#statusbar{display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
#status b{color:var(--text)}#status.err b{color:#b3261e}#status.ok b{color:#1f7a37}#hov{margin-left:auto;font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#1b2230;color:#fff;padding:9px 14px;border-radius:6px;font-size:12.5px;z-index:90;max-width:70vw}.toast.warn{background:#8a3a00}
.menu{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(20,30,50,.18);padding:4px;min-width:250px;display:flex;flex-direction:column;max-height:80vh;overflow:auto}
.menu button{display:flex;justify-content:space-between;gap:20px;border:none;background:none;text-align:left;padding:7px 10px;font:12.5px var(--font);border-radius:4px;cursor:pointer;color:var(--text)}.menu button:hover{background:#eaf3ff}.menu button span{color:var(--dim)}.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.ov{position:fixed;inset:0;background:rgba(15,20,30,.35);display:grid;place-items:center;z-index:70}
.mdl{background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(820px,92vw);max-height:86vh;display:flex;flex-direction:column}.mdl .mh2{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}.mdl .mb{padding:6px 18px 18px;overflow:auto;font-size:13px;line-height:1.55}.mdl h4{margin:14px 0 4px;font-size:13px}
.edit{height:24px;font:13px var(--font);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
/* svg */
#cv .hole{fill:#3d3d3a}#cv .hl{fill:#22c55e}#cv .hlf{fill:none;stroke:#16a34a;stroke-width:1.6}
#cv .part{cursor:move}#cv .part.sel{filter:drop-shadow(0 0 2.5px #1a73e8) drop-shadow(0 0 1px #1a73e8)}
#cv .wire{cursor:pointer}#cv .wire.sel path.wb{stroke-dasharray:none;filter:drop-shadow(0 0 2px #1a73e8)}
#cv .h{fill:#fff;stroke:#1a73e8;stroke-width:1.5;cursor:grab}#cv .bad{fill:none;stroke:#e11d48;stroke-width:1.5}
#cv text{font-family:var(--font);user-select:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
</style></head>
<body><div id="app">
<div id="top">
 <div class="logo">CE</div><span id="docname" title="Click to rename">breadboard</span>
 <button class="tb" id="bFile">File ▾</button><button class="tb" id="bEx">Examples ▾</button><button class="tb" id="bUndo" title="Undo (Ctrl+Z)">↶</button><button class="tb" id="bRedo" title="Redo (Ctrl+Y)">↷</button><div class="sep"></div>
 <button class="tb on" id="tSel" title="Select and move (V)">Select<kbd>V</kbd></button><button class="tb" id="tWire" title="Draw wires (W)">Wire<kbd>W</kbd></button>
 <select id="wireColor" class="tb" style="border:1px solid var(--line)" aria-label="Wire colour" title="Colour of new wires"><option value="red">Red</option><option value="black">Black</option><option value="yellow">Yellow</option><option value="green">Green</option><option value="blue">Blue</option><option value="orange">Orange</option><option value="white">White</option></select>
 <button class="tb" id="bRot" title="Rotate the selected part (R)">Rotate<kbd>R</kbd></button><button class="tb" id="bDel" title="Delete the selection (Delete)">Delete</button><div class="sep"></div>
 <button class="tb pri" id="bRun" title="Start or stop the simulation (F5)">Run<kbd>F5</kbd></button><button class="tb" id="bRec" title="Record a video of the running board (F8)" aria-pressed="false"><span class="recdot" aria-hidden="true"></span>Record<kbd>F8</kbd></button><button class="tb" id="bSnd" title="Sound for buzzers and relays" aria-pressed="false">Sound</button>
 <button class="tb" id="bCirc" title="Open this circuit as a schematic in the Circuit tool">Open in Circuit</button><button class="tb" id="bPcb" title="Turn this circuit into a printed circuit board">Open in PCB</button><button class="tb" id="bRef">Reference</button>
</div>
<div id="main">
 <div id="pal"></div>
 <div id="stage"><svg id="cv" aria-label="Breadboard"><defs>
  <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="currentColor" stop-opacity=".85"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></radialGradient>
  <linearGradient id="ic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#1c1c1c"/></linearGradient>
  <linearGradient id="bat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2b2b2b"/><stop offset=".5" stop-color="#4a4a4a"/><stop offset="1" stop-color="#2b2b2b"/></linearGradient>
 </defs><g id="view"><g id="gBoard"></g><g id="gHl"></g><g id="gParts"></g><g id="gWires"></g><g id="gOver"></g></g></svg>
  <div id="hint"></div><div id="zoom"><button id="zIn" title="Zoom in">+</button><button id="zOut" title="Zoom out">−</button><button id="zFit" title="Fit">⤢</button></div></div>
 <div id="side"></div>
</div>
<div id="statusbar"><span id="status"><b>Ready.</b> Drag parts from the left onto the board</span><span id="simt"></span><span id="hov"></span></div>
</div>
<input type="file" id="fileIn" accept=".cebb,.json" hidden>
<script src="ino-core.js"></script>
<script src="bb-core.js"></script>
<script src="bb-examples.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const N=window.cesimNative;const P=BB.P;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ST={doc:{parts:[],wires:[]},name:'breadboard',filePath:null,tool:'select',sel:null,placing:null,wiring:null,running:false,sim:null,undo:[],redo:[],view:{x:-140,y:-110,w:860,h:390},hover:null,note:''};
const svg=$('#cv');const SW=(n)=>document.createElementNS('http://www.w3.org/2000/svg',n);
/* ---------- view ---------- */
function applyView(){const v=ST.view;svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`)}
function toWorld(cx,cy){const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const m=svg.getScreenCTM();if(!m)return[0,0];const r=pt.matrixTransform(m.inverse());return[r.x,r.y]}
const snap=v=>Math.round(v/P)*P;
function fit(){const ps=ST.doc.parts.flatMap(p=>BB.legsOf(p).concat(p.pos?[p.pos]:[]));let x0=-10,y0=-20,x1=670,y1=220;for(const[x,y]of ps){x0=Math.min(x0,x-40);x1=Math.max(x1,x+40);y0=Math.min(y0,y-50);y1=Math.max(y1,y+80)}const r=svg.getBoundingClientRect();const w=x1-x0,h=y1-y0;const asp=r.width/Math.max(1,r.height);let vw=w,vh=h;if(vw/vh<asp)vw=vh*asp;else vh=vw/asp;ST.view={x:x0-(vw-w)/2,y:y0-(vh-h)/2,w:vw,h:vh};applyView()}
function zoomAt(f,cx,cy){const v=ST.view;const[wx,wy]=cx==null?[v.x+v.w/2,v.y+v.h/2]:toWorld(cx,cy);const nw=Math.max(120,Math.min(4000,v.w*f));const k=nw/v.w;ST.view={x:wx-(wx-v.x)*k,y:wy-(wy-v.y)*k,w:nw,h:v.h*k};applyView()}
/* ---------- board ---------- */
function drawBoard(){let h=`<rect x="8" y="-8" width="655" height="226" rx="9" fill="#f3f2ec" stroke="#d6d3c7" stroke-width="1.5"/><rect x="10" y="101" width="651" height="8" fill="#e5e2d8"/>`;
 h+=`<line x1="34" y1="3" x2="640" y2="3" stroke="#e23a3a" stroke-width="1.6"/><line x1="34" y1="27" x2="640" y2="27" stroke="#2d6cdf" stroke-width="1.6"/><line x1="34" y1="183" x2="640" y2="183" stroke="#e23a3a" stroke-width="1.6"/><line x1="34" y1="207" x2="640" y2="207" stroke="#2d6cdf" stroke-width="1.6"/>`;
 h+=`<text x="22" y="13" font-size="9" fill="#e23a3a" font-weight="700">+</text><text x="22" y="24" font-size="11" fill="#2d6cdf" font-weight="700">−</text><text x="22" y="193" font-size="9" fill="#e23a3a" font-weight="700">+</text><text x="22" y="204" font-size="11" fill="#2d6cdf" font-weight="700">−</text>`;
 for(const r of BB.ROWS){h+=`<text x="17" y="${BB.ROWY[r]+3}" font-size="7.5" fill="#8a877c" text-anchor="middle">${r}</text><text x="653" y="${BB.ROWY[r]+3}" font-size="7.5" fill="#8a877c" text-anchor="middle">${r}</text>`}
 for(let c=1;c<=BB.COLS;c++)if(c===1||c%5===0)h+=`<text x="${BB.colX(c)}" y="40" font-size="7" fill="#8a877c" text-anchor="middle">${c}</text><text x="${BB.colX(c)}" y="175" font-size="7" fill="#8a877c" text-anchor="middle">${c}</text>`;
 for(const[k,o]of BB.HOLES)h+=`<rect class="hole" x="${o.x-2.3}" y="${o.y-2.3}" width="4.6" height="4.6" rx=".8"/>`;
 $('#gBoard').innerHTML=h}
/* ---------- parts drawing ---------- */
const LEGC='#a9adb3';
function partSVG(p,ghost){const L=BB.LIB[p.type];const st=ST.sim&&ST.sim.state[p.id]||{};const legs=BB.legsOf(p);let h='';const t=p.type;
 const legLine=(a,b,c)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c||LEGC}" stroke-width="1.6" stroke-linecap="round"/>`;
 if(L.flex&&!L.probes){const[a,b]=legs;const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;const ang=Math.atan2(dy,dx)*180/Math.PI;
  if(t==='resistor'||t==='diode'){const bl=Math.min(24,Math.max(10,len-6));h+=legLine(a,b);const bd=BB.bands(p.props.ohms);h+=`<g transform="translate(${mx} ${my}) rotate(${ang})">`;if(t==='resistor'){h+=`<rect x="${-bl/2}" y="-4" width="${bl}" height="8" rx="3.5" fill="#e6d3a8" stroke="#b79d68" stroke-width=".7"/>`;const st2=bl/6;bd.forEach((c,i)=>{const x=-bl/2+st2*(i<3?i+1:4.6);h+=`<rect x="${x-1}" y="-4" width="2" height="8" fill="${c}"/>`})}else{h+=`<rect x="${-bl/2}" y="-3.5" width="${bl}" height="7" rx="2" fill="#1d1d1d"/><rect x="${bl/2-4.5}" y="-3.5" width="2.2" height="7" fill="#c9cdd2"/>`}h+='</g>'}
  else if(t==='led'){const nx=-uy,ny=ux;const up=(ny>0?-1:1);const cx=mx+nx*up*12,cy=my+ny*up*12;const col=BB.LED_RGB[p.props.color]||'#ff3b30';const br=st.burned?0:Math.min(1,Math.max(0,(st.i||0)/0.015));
   h+=legLine(a,[cx-ux*2.5,cy-uy*2.5])+legLine(b,[cx+ux*2.5,cy+uy*2.5]);if(br>0.02)h+=`<circle cx="${cx}" cy="${cy}" r="${10+br*14}" fill="${glowRef(col)}" opacity="${0.35+0.65*br}"/>`;
   h+=`<circle cx="${cx}" cy="${cy}" r="6" fill="${st.burned?'#3b3b3b':col}" fill-opacity="${st.burned?1:0.45+0.55*br}" stroke="${st.burned?'#222':'rgba(0,0,0,.35)'}" stroke-width=".8"/><circle cx="${cx-2}" cy="${cy-2}" r="1.8" fill="#fff" opacity=".6"/>`;
   if(st.burned)h+=`<g opacity=".7"><circle cx="${cx+3}" cy="${cy-10}" r="3.5" fill="#888"/><circle cx="${cx-1}" cy="${cy-15}" r="4" fill="#aaa"/><circle cx="${cx+4}" cy="${cy-20}" r="3" fill="#ccc"/></g>`;
   h+=`<text x="${a[0]+(a[0]<b[0]?-6:6)}" y="${a[1]+3}" font-size="8" fill="#b3261e" text-anchor="middle" font-weight="700">+</text>`}
  else if(t==='ldr'){const nx=-uy,ny=ux;const up=(ny>0?-1:1);const cx=mx+nx*up*11,cy=my+ny*up*11;const lt=Math.max(0,Math.min(1,+p.props.light));h+=legLine(a,[cx-ux*4,cy-uy*4])+legLine(b,[cx+ux*4,cy+uy*4]);if(lt>0.02)h+=`<circle cx="${cx}" cy="${cy}" r="${12+lt*8}" fill="${glowRef('#ffd84d')}" opacity="${0.25+0.6*lt}"/>`;
   h+=`<g transform="translate(${cx} ${cy}) rotate(${ang})"><circle r="8" fill="#f1e3c6" stroke="#b79d68" stroke-width=".8"/><path d="M-5 -4.5h10v3h-10v3h10v3h-10" stroke="#c0541e" stroke-width="1.3" fill="none"/></g><text x="${cx}" y="${cy-11}" font-size="6.5" text-anchor="middle" fill="#7a5a00" font-weight="600">${Math.round(lt*100)}% light</text>`}
  else if(t==='pled'){const nx=-uy,ny=ux;const up=(ny>0?-1:1);const cx=mx+nx*up*16,cy=my+ny*up*16;const col=BB.LED_RGB[p.props.color]||'#f4f7ff';const gc=p.props.color==='white'?'#ffe066':col;const br=st.burned?0:Math.min(1,Math.max(0,(st.i||0)/0.03));
   h+=legLine(a,[cx-ux*4,cy-uy*4])+legLine(b,[cx+ux*4,cy+uy*4]);if(br>0.02)h+=`<circle cx="${cx}" cy="${cy}" r="${18+br*26}" fill="${glowRef(gc)}" opacity="${0.45+0.55*br}"/>`;
   h+=`<path d="M${cx} ${cy-12}l10.4 6v12L${cx} ${cy+12}l-10.4-6v-12z" fill="#d6dbe1" stroke="#8c96a3" stroke-width=".8"/><circle cx="${cx}" cy="${cy}" r="6.5" fill="${st.burned?'#3b3b3b':col}" fill-opacity="${st.burned?1:0.5+0.5*br}" stroke="#c9b45a" stroke-width=".9"/><rect x="${cx-2.2}" y="${cy-2.2}" width="4.4" height="4.4" fill="${st.burned?'#222':'#f5d76e'}" opacity=".85"/>`;
   h+=`<text x="${a[0]+(a[0]<b[0]?-6:6)}" y="${a[1]+3}" font-size="8" fill="#b3261e" text-anchor="middle" font-weight="700">+</text><text x="${cx}" y="${cy+20}" font-size="6" text-anchor="middle" fill="#445">1 W</text>`}
  else if(t==='capacitor'){const nx=-uy,ny=ux;const up=(ny>0?-1:1);const cx=mx+nx*up*9,cy=my+ny*up*9;h+=legLine(a,[cx,cy])+legLine(b,[cx,cy]);h+=`<ellipse cx="${cx}" cy="${cy}" rx="6.5" ry="5" fill="#e5a128" stroke="#a86e0a" stroke-width=".8"/><text x="${cx}" y="${cy+2.5}" font-size="5.5" text-anchor="middle" fill="#5c3a00">${esc(BB.fmtF(p.props.farads).replace(' ',''))}</text>`}
  else if(t==='ecap'){const nx=-uy,ny=ux;const up=(ny>0?-1:1);const cx=mx+nx*up*13,cy=my+ny*up*13;h+=legLine(a,[cx-ux*3,cy-uy*3])+legLine(b,[cx+ux*3,cy+uy*3]);h+=`<g transform="translate(${cx} ${cy}) rotate(${ang})"><rect x="-8" y="-10" width="16" height="17" rx="3" fill="#1e3a8a" stroke="#0f1f4f" stroke-width=".8"/><rect x="3.5" y="-10" width="4.5" height="17" fill="#9db4e0"/><text x="5.8" y="-1" font-size="6" fill="#1e3a8a" text-anchor="middle" font-weight="700">−</text></g><text x="${cx}" y="${cy+16}" font-size="6.5" text-anchor="middle" fill="#334">${esc(BB.fmtF(p.props.farads))}</text>`}}
 else if(L.probes){const[a,b]=legs;const[px,py]=p.pos;const val=t==='voltmeter'?(ST.running&&st.v!=null?fmtV(st.v):'— V'):(ST.running&&st.i!=null?fmtA(st.i):'— mA');

 const send=()=>{const i=$('#fSend');if(!i||!ST.sim)return;const st=ST.sim.state[p.id];if(st&&st.rt){st.rt.send(i.value+'\n');i.value=''}};on('#fSendB','click',send);on('#fSend','keydown',e=>{e.stopPropagation();if(e.key==='Enter')send()});
 const ser=$('#fSer');if(ser)ser.scrollTop=ser.scrollHeight;
 on('#fRot','click',rotSel);on('#fDel','click',delSel);
 on('#fFix','click',()=>{if(ST.sim){const s=ST.sim.state[p.id];s.burned=false;s.over=0;ST.sim.warn.delete(p.id+':burn')}render();renderSide()});
 on('#fWcol','change',e=>{snapshot();ST.doc.wires[ST.sel.wire].color=e.target.value;changed(false)});

/* ---------- files, menus ---------- */
function toast(m,warn){$$('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast'+(warn?' warn':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),warn?5000:3000)}
function setStatus(h,k){const s=$('#status');s.innerHTML=h;s.className=k||''}
function menu(btn,items){closeMenu();const m=document.createElement('div');m.className='menu';m.id='menu';for(const it of items){if(it==='-'){m.appendChild(document.createElement('hr'));continue}const b=document.createElement('button');b.innerHTML=`${esc(it[0])}${it[2]?`<span>${it[2]}</span>`:''}`;b.onclick=()=>{closeMenu();it[1]()};m.appendChild(b)}document.body.appendChild(m);const r=btn.getBoundingClientRect();m.style.left=r.left+'px';m.style.top=(r.bottom+4)+'px';setTimeout(()=>document.addEventListener('pointerdown',outside,true),0)}
function outside(e){if(!e.target.closest('#menu'))closeMenu()}
function closeMenu(){const m=$('#menu');if(m)m.remove();document.removeEventListener('pointerdown',outside,true)}
function setName(n){ST.name=n||'breadboard';$('#docname').textContent=ST.name;document.title=ST.name+' · CEsim Breadboard'}
function loadDoc(d,name,path,note){if(ST.running)toggleRun();ST.doc={parts:(d.parts||[]).filter(p=>BB.LIB[p.type]),wires:d.wires||[]};ST.note=note||d.note||'';ST.sel=null;ST.undo=[];ST.redo=[];ST.filePath=path||null;setName(name);conCache=null;render();renderSide();requestAnimationFrame(fit);saveLocal()}
window.cesimOpenText=(name,text,path)=>{try{const d=JSON.parse(text);if(d.format&&d.format!=='cesim-breadboard')throw new Error('not a breadboard file');loadDoc(d,name.replace(/\.[^.]+$/,''),path);toast('Opened '+name)}catch(e){toast('This file is not a CEsim breadboard',true)}};
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];if(f)window.cesimOpenText(f.name,await f.text(),N&&N.pathFor?N.pathFor(f):null);e.target.value=''});
function docText(){return JSON.stringify({format:'cesim-breadboard',version:1,parts:ST.doc.parts.map(p=>{const c=JSON.parse(JSON.stringify(p));delete c.props.pressed;return c}),wires:ST.doc.wires,note:ST.note||undefined})}
async function saveFile(asNew){const nm=ST.name.replace(/[^\w.-]+/g,'_')+'.cebb';const text=docText();if(N&&N.write&&ST.filePath&&!asNew){await N.write(ST.filePath,text);toast('Saved '+ST.filePath.split(/[\\/]/).pop());return}if(N&&N.save){const r=await N.save(nm,text);if(r){ST.filePath=r;setName(r.split(/[\\/]/).pop().replace(/\.[^.]+$/,''));toast('Saved '+r.split(/[\\/]/).pop())}return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=nm;document.body.appendChild(a);a.click();a.remove()}
/* video of the running board: the board drawing is copied to a canvas about 15 times a second and recorded (MP4 where possible, otherwise WebM) */
const REC={mr:null};
function recMime(){if(!window.MediaRecorder)return '';for(const m of ['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'])if(MediaRecorder.isTypeSupported(m))return m;return ''}
function toggleRec(){if(REC.mr){stopRec();return}const mime=recMime();if(!mime||!HTMLCanvasElement.prototype.captureStream){toast('Video recording is not available on this system.',true);return}
 if(!ST.running){toggleRun();if(!ST.running)return}
 const r=svg.getBoundingClientRect();const k=Math.min(2,1920/Math.max(1,r.width));const c=document.createElement('canvas');c.width=Math.round(r.width*k)&~1;c.height=Math.round(r.height*k)&~1;const g=c.getContext('2d');
 g.fillStyle='#dfe5ec';g.fillRect(0,0,c.width,c.height);let busy=false,alive=true;
 const frame=()=>{if(!alive||busy)return;busy=true;const s=new XMLSerializer().serializeToString(svg);const url=URL.createObjectURL(new Blob([s.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ')],{type:'image/svg+xml'}));const img=new Image();
  img.onload=()=>{g.fillStyle='#dfe5ec';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);busy=false};img.onerror=()=>{URL.revokeObjectURL(url);busy=false};img.src=url};
 frame();const tick=setInterval(frame,1000/15);
 let stream,mr;try{stream=c.captureStream(15);mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6e6})}catch(e){clearInterval(tick);toast('Could not start the recording: '+e.message,true);return}
 const chunks=[];const t0=Date.now();mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 mr.onstop=async()=>{alive=false;clearInterval(tick);stream.getTracks().forEach(t=>t.stop());const type=mime.split(';')[0];const blob=new Blob(chunks,{type});const ext=/mp4/.test(type)?'mp4':'webm';if(!blob.size){toast('The recording is empty.',true);return}
  const bytes=new Uint8Array(await blob.arrayBuffer());const nm=ST.name.replace(/[^\w.-]+/g,'_')+'.'+ext;const secs=Math.round((Date.now()-t0)/1000);REC.last={bytes,ext,secs};
  if(N&&N.saveBinary){let b='';for(let i=0;i<bytes.length;i+=32768)b+=String.fromCharCode.apply(null,bytes.subarray(i,i+32768));await N.saveBinary(nm,btoa(b))}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nm;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
  toast('Video saved ('+secs+' s, '+ext.toUpperCase()+').')};
 mr.start(500);REC.mr=mr;REC.t0=t0;const b=$('#bRec');b.classList.add('on');b.setAttribute('aria-pressed','true');
 REC.tick=setInterval(()=>{const t=Math.floor((Date.now()-t0)/1000);b.innerHTML='<span class="recdot" aria-hidden="true"></span>Stop '+String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')+'<kbd>F8</kbd>';if(t>=600)stopRec()},500);
 toast('Recording. Press Record (F8) again to stop and save.')}
function stopRec(){const mr=REC.mr;if(!mr)return;REC.mr=null;clearInterval(REC.tick);const b=$('#bRec');b.classList.remove('on');b.setAttribute('aria-pressed','false');b.innerHTML='<span class="recdot" aria-hidden="true"></span>Record<kbd>F8</kbd>';try{mr.requestData();mr.stop()}catch(e){}}
$('#bRec').onclick=toggleRec;$('#bSnd').onclick=toggleSound;
/* one radial gradient per glow colour: a shared gradient with currentColor takes the colour of the gradient itself, which drew dark halos */
function glowRef(col){col=String(col||'#ffffff');const id='glow_'+col.replace(/[^0-9a-zA-Z]/g,'');if(!document.getElementById(id)){const d=svg.querySelector('defs');if(d){const g=document.createElementNS('http://www.w3.org/2000/svg','radialGradient');g.id=id;g.innerHTML=`<stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="${col}" stop-opacity=".85"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>`;d.appendChild(g)}}return 'url(#'+id+')'}
function exportPng(){const s=new XMLSerializer().serializeToString(svg);const v=ST.view;const img=new Image();const blob=new Blob([s.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ')],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);img.onload=()=>{const c=document.createElement('canvas');const r=svg.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const g=c.getContext('2d');g.fillStyle='#dfe5ec';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);const d=c.toDataURL('image/png');const nm=ST.name.replace(/[^\w.-]+/g,'_')+'.png';if(N&&N.saveBinary)N.saveBinary(nm,d.split(',')[1]);else{const a=document.createElement('a');a.href=d;a.download=nm;a.click()}};img.src=url}
function toPcb(){if(!ST.doc.parts.length){toast('The board is empty',true);return}const r=BB.toPcb(ST.doc);if(!r.comps.length){toast('No part here has a footprint',true);return}try{localStorage.setItem('cesim.handoff.pcb',JSON.stringify({kind:'pcb',comps:r.comps,nets:r.nets,skipped:r.skipped,name:ST.name,from:'Breadboard'}))}catch(e){}if(N&&N.openTool)N.openTool('pcb');else window.open('pcb.html','_blank');toast('Opening the board in the PCB tool')}
function toCircuit(){if(!ST.doc.parts.length){toast('The board is empty',true);return}const text=BB.toNetlist(ST.doc,ST.name);try{localStorage.setItem('cesim.handoff.circuit',JSON.stringify({kind:'code',text,name:ST.name}))}catch(e){}if(N&&N.openTool)N.openTool('circuit');else window.open('circuit.html?handoff=1','_blank');toast('Opening the schematic in the Circuit tool')}
$('#bFile').onclick=e=>menu(e.currentTarget,[['New',()=>loadDoc({parts:[],wires:[]},'breadboard'),''],['Open…',()=>$('#fileIn').click(),'Ctrl+O'],'-',['Save',()=>saveFile(false),'Ctrl+S'],['Save as…',()=>saveFile(true),'Ctrl+Shift+S'],'-',['Export picture (PNG)',exportPng,''],['Record video',toggleRec,'F8'],['Copy netlist',()=>{navigator.clipboard&&navigator.clipboard.writeText(BB.toNetlist(ST.doc,ST.name)).then(()=>toast('Netlist copied'))},''],['Open in Circuit',toCircuit,''],['Open in PCB',toPcb,'']]);
$('#bEx').onclick=e=>menu(e.currentTarget,Object.keys(BB_EXAMPLES.EX).map(k=>[k,()=>{const d=BB_EXAMPLES.EX[k]();loadDoc(d,k.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''),null,d.note);toast('Loaded: '+k+'. Press F5 to run')}]));
$('#docname').onclick=()=>{const el=$('#docname');const inp=document.createElement('input');inp.className='edit';inp.value=ST.name;el.textContent='';el.appendChild(inp);inp.focus();inp.select();let done=false;const fin=ok=>{if(done)return;done=true;setName(ok&&inp.value.trim()?inp.value.trim():ST.name);saveLocal()};inp.onkeydown=e=>{if(e.key==='Enter')fin(true);if(e.key==='Escape')fin(false);e.stopPropagation()};inp.onblur=()=>fin(true)};
$('#tSel').onclick=()=>setTool('select');$('#tWire').onclick=()=>setTool('wire');$('#bRot').onclick=rotSel;$('#bDel').onclick=delSel;$('#bRun').onclick=toggleRun;$('#bCirc').onclick=toCircuit;$('#bPcb').onclick=toPcb;$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bRef').onclick=showRef;
$('#zIn').onclick=()=>zoomAt(0.8);$('#zOut').onclick=()=>zoomAt(1.25);$('#zFit').onclick=fit;
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)window.cesimOpenText(f.name,await f.text(),N&&N.pathFor?N.pathFor(f):null)});
function showRef(){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="mdl" role="dialog" aria-label="Reference"><div class="mh2"><b>Breadboard reference</b><button class="btn" id="refX">Close</button></div><div class="mb">
<h4>The board</h4><p>Each column of five holes (a–e, and f–j) is one connection. The gap in the middle separates the two halves, which is why chips sit across it. The long rows at the top and bottom are the power rails: red for +, blue for −. Hover a hole: the holes connected to it turn green, and while the simulation runs the status bar shows its voltage.</p>
<h4>Parts</h4><p>Drag a part from the left and drop it on the board. Resistors, LEDs, diodes and capacitors have bendable legs: select the part and drag a leg's circle to another hole. Other parts move as a whole; R rotates them. A red circle means a leg is not in a hole. The LED's longer leg (+, anode) must point to the higher voltage.</p>
<h4>Wires</h4><p>Press W, click a hole, then click where the wire ends. Hold Shift to keep drawing from the end. Select a wire to change its colour or drag its ends. The battery and the power supply sit beside the board: wire their terminals to the rails.</p>
<h4>Simulation</h4><p>F5 runs the circuit in real time. LEDs glow with their current, meters show values, and you can press buttons, slide switches and turn knobs (mouse wheel). Too much current burns an LED, a resistor that gets too hot or a short circuit shows a warning under Problems. Logic chips are 74LS (TTL): an unconnected input reads HIGH, and they need +5 V on pin 14 and − on pin 7.</p>
<h4>Keys</h4><p>V select · W wire · R rotate · Delete remove · Ctrl+D duplicate · Ctrl+Z undo · F5 run · mouse wheel zoom · drag the background to move the view</p></div></div>`;document.body.appendChild(o);o.onclick=e=>{if(e.target===o||e.target.id==='refX')o.remove()}}
window.addEventListener('beforeunload',()=>{try{localStorage.setItem('cesim.bb.doc',JSON.stringify({name:ST.name,doc:JSON.parse(docText())}))}catch(e){}});
let svT=null;function saveLocal(){clearTimeout(svT);svT=setTimeout(()=>{try{localStorage.setItem('cesim.bb.doc',JSON.stringify({name:ST.name,doc:JSON.parse(docText())}))}catch(e){}},400)}
window.addEventListener('resize',()=>{});
function start(){drawBoard();buildPalette();applyView();let d=null;if(!/blank/.test(location.search)){try{d=JSON.parse(localStorage.getItem('cesim.bb.doc')||'null')}catch(e){}}
 if(d&&d.doc){ST.doc={parts:d.doc.parts||[],wires:d.doc.wires||[]};ST.note=d.doc.note||'';setName(d.name)}else{const e=BB_EXAMPLES.EX['LED and resistor']();ST.doc={parts:e.parts,wires:e.wires};ST.note=e.note;setName('led_and_resistor')}
 render();renderSide();hint('');requestAnimationFrame(fit)}
window.CEB={ST,toggleRun,loadDoc,render,fit,get sim(){return ST.sim},setTool,startPlacing,undo};
start();
