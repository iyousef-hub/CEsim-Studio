<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="fonts/fonts.css" rel="stylesheet"><title>CEsim Arduino</title>
<style>
:root{--bg:#e9edf2;--panel:#f7f8fa;--line:#cdd3dc;--text:#1b2230;--dim:#5e6979;--hover:#e1e7ef;--accent:#c2410c;--teal:#00878f;--font:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--lh:20px}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:13px/1.35 var(--font);overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr 28px;height:100%}
#top{display:flex;flex-wrap:wrap;row-gap:2px;align-items:center;gap:2px;padding:4px 10px;min-height:44px;background:var(--panel);border-bottom:1px solid var(--line);user-select:none}
.logo{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font:600 10px var(--mono);margin-right:6px}
#docname{flex:none;font-weight:600;margin-right:10px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;padding:3px 5px;border-radius:3px}#docname:hover{background:var(--hover)}
.tb{flex:none;height:30px;min-width:30px;padding:0 9px;border:1px solid transparent;border-radius:4px;background:none;color:var(--text);cursor:pointer;font:12.5px var(--font);white-space:nowrap}
.tb:hover{background:var(--hover);border-color:var(--line)}.tb.pri{background:var(--teal);color:#fff}.tb.pri:hover{filter:brightness(.93)}.tb:disabled{opacity:.4;cursor:default;background:none;border-color:transparent}
.tb kbd{font:10.5px var(--mono);color:var(--dim);margin-left:4px}.tb.pri kbd{color:#c9f0f2}
.sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 6px}
select.s{height:28px;border:1px solid var(--line);border-radius:4px;background:#fff;font:12px var(--font);color:var(--text)}
#clock{font:12px var(--mono);color:var(--dim);margin-left:8px;min-width:86px}
#main{display:grid;grid-template-columns:minmax(0,1fr) 480px;min-height:0}
#left{display:grid;grid-template-rows:minmax(0,1fr) 6px var(--bh,240px);min-height:0;min-width:0}
#ed{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr);background:#fff;min-height:0;overflow:hidden}
#gut{position:relative;overflow:hidden;background:#f3f5f8;border-right:1px solid #e1e5eb;user-select:none}
#gutIn{position:absolute;left:0;right:0;top:0;padding-top:8px;will-change:transform}
.gl{height:var(--lh);font:12px/var(--lh) var(--mono);color:#98a2b0;text-align:right;padding-right:9px;position:relative}.gl.err{color:#c62828;font-weight:600}.gl.warn{color:#9a6700;font-weight:600}.gl.cur{color:#00666c;font-weight:600}
#code{position:relative;overflow:hidden;min-width:0}
#marks,#hl{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}#marks{right:0}.mk{position:absolute;left:0;right:0;height:var(--lh)}.mk.err{background:#fdecec}.mk.warn{background:#fff6dc}.mk.cur{background:#ddf3f4;box-shadow:inset 3px 0 #00878f}
#hl,#src{margin:0;padding:8px 14px 40px;font:13px/var(--lh) var(--mono);white-space:pre;tab-size:4}
#src{position:absolute;inset:0;width:100%;height:100%;border:0;outline:0;resize:none;background:transparent;color:transparent;caret-color:#111;overflow:auto;z-index:2}#src::selection{background:rgba(26,140,255,.25)}
.t-k{color:#0b57a8;font-weight:500}.t-ty{color:#00797f;font-weight:500}.t-f{color:#c45200}.t-c{color:#7d8794;font-style:italic}.t-s{color:#15803d}.t-n{color:#7a3fb5}.t-p{color:#6b4ea0}.t-cn{color:#0d6e8a;font-weight:500}.t-e{color:#c62828;font:italic 12px var(--font)}.t-w{color:#9a6700;font:italic 12px var(--font)}
#split{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:row-resize}#split:hover{background:#d8e2ee}
#bot{display:grid;grid-template-rows:32px minmax(0,1fr);background:#fff;min-height:0}
#tabs{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);padding-left:6px;user-select:none}
.tab{border:0;background:none;padding:0 13px;font:12.5px var(--font);color:var(--dim);cursor:pointer;border-bottom:2px solid transparent}.tab:hover{color:var(--text)}.tab.on{color:var(--text);border-bottom-color:var(--teal);font-weight:600}
.tab i{font-style:normal;background:#c62828;color:#fff;border-radius:9px;padding:0 6px;font-size:10.5px;margin-left:5px}.tab i.w{background:#b07b00}
.pane{min-height:0;position:relative;overflow:auto}
#p-ser{display:grid;grid-template-rows:minmax(0,1fr) 38px;overflow:hidden}
#serOut{font:12.5px/1.45 var(--mono);padding:8px 12px;white-space:pre-wrap;word-break:break-all;overflow:auto;background:#fff;user-select:text}#serOut .hint{color:var(--dim);font-style:italic;font-family:var(--font)}
.serIn{display:flex;gap:6px;align-items:center;padding:5px 8px;border-top:1px solid var(--line);background:var(--panel)}
.serIn input[type=text]{flex:1;height:27px;border:1px solid var(--line);border-radius:4px;padding:0 8px;font:12.5px var(--mono)}
.btn{height:27px;padding:0 11px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text);cursor:pointer;font:12px var(--font)}.btn:hover{background:var(--hover)}.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.serIn label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:3px;white-space:nowrap}
#plot{width:100%;height:100%;display:block}
table.g{border-collapse:collapse;font:12.5px/1.5 var(--mono);width:100%}table.g th{position:sticky;top:0;background:#f3f6fa;font:600 11.5px var(--font);color:var(--dim);text-align:left;padding:4px 12px;border-bottom:1px solid var(--line)}table.g td{padding:2px 12px;border-bottom:1px solid #f0f2f5;white-space:nowrap}td.chg{background:#ffe08a}
.prob{display:flex;gap:10px;padding:6px 12px;border-bottom:1px solid #f0f2f5;cursor:pointer;font-size:12.5px}.prob:hover{background:#f5f8fc}.prob b{font:600 12px var(--mono);min-width:64px;color:#c62828}.prob.w b{color:#9a6700}
.empty{padding:16px;color:var(--dim);font-size:12.5px}
/* right */
#right{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 12px 20px;user-select:none}
#board{display:block;width:100%;height:auto}
.rh{display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px}.rh b{font:600 11px var(--font);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
#parts{display:flex;flex-direction:column;gap:8px}
.part{background:#fff;border:1px solid #dde2e9;border-radius:8px;padding:9px 10px;display:grid;grid-template-columns:62px 1fr;gap:4px 10px;align-items:center;position:relative}
.part .vis{grid-row:span 3;display:grid;place-items:center;min-height:56px}
.part h4{margin:0;font:600 12.5px var(--font);display:flex;gap:6px;align-items:center}.part h4 span{font:400 11.5px var(--font);color:var(--dim)}
.part .x{position:absolute;right:6px;top:5px;border:0;background:none;color:#98a2b0;cursor:pointer;font-size:15px;line-height:1;padding:3px 5px;border-radius:4px}.part .x:hover{background:#fdecec;color:#c62828}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--dim)}.row select{height:24px;border:1px solid var(--line);border-radius:4px;font:11.5px var(--font);background:#fff}
.row input[type=range]{flex:1;min-width:120px;accent-color:var(--teal)}.row .val{font:12px var(--mono);color:var(--text);min-width:70px}
.note{font-size:11.5px;color:#9a6700;grid-column:2}
.pbtn{width:46px;height:46px;border-radius:50%;border:4px solid #3c4450;background:radial-gradient(circle at 40% 35%,#444c58,#1d232b);cursor:pointer;box-shadow:0 2px 0 #222}.pbtn.on{transform:translateY(2px);box-shadow:none;background:radial-gradient(circle at 40% 35%,#5a6575,#2b333d)}
.tog{width:46px;height:24px;border-radius:12px;background:#c4ccd6;border:0;position:relative;cursor:pointer}.tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .12s}.tog.on{background:var(--teal)}.tog.on::after{left:25px}
.lcdw{grid-column:1/-1;background:#2a3a0a;border-radius:6px;padding:8px;display:flex;justify-content:center}
.lcd{font:20px/1.15 var(--mono);color:#1c2a00;background:#9dbb2c;padding:6px 8px;border-radius:3px;white-space:pre;letter-spacing:.07em;box-shadow:inset 0 0 0 2px #7f9a1f}.lcd.dark{background:#5e7020;color:#2b3600}
.addm{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(20,30,50,.18);padding:4px;display:grid;grid-template-columns:1fr 1fr;gap:2px;width:340px}
.addm button{border:0;background:none;text-align:left;padding:7px 9px;border-radius:4px;cursor:pointer;font:12.5px var(--font);color:var(--text)}.addm button:hover{background:#eaf3ff}.addm button span{display:block;font-size:11px;color:var(--dim)}
#statusbar{display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
#status b{color:var(--text)}#status.err b{color:#b3261e}#status.ok b{color:#1f7a37}#pos{margin-left:auto;font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#1b2230;color:#fff;padding:9px 14px;border-radius:6px;font-size:12.5px;z-index:90;max-width:70vw}.toast.warn{background:#8a3a00}
.menu{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(20,30,50,.18);padding:4px;min-width:250px;display:flex;flex-direction:column;max-height:80vh;overflow:auto}
.menu button{display:flex;justify-content:space-between;gap:20px;border:none;background:none;text-align:left;padding:7px 10px;font:12.5px var(--font);border-radius:4px;cursor:pointer;color:var(--text)}.menu button:hover{background:#eaf3ff}.menu button span{color:var(--dim)}.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.ov{position:fixed;inset:0;background:rgba(15,20,30,.35);display:grid;place-items:center;z-index:70}
.mdl{background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(860px,92vw);max-height:86vh;display:flex;flex-direction:column}
.mdl .mh2{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}.mdl .mb{padding:6px 18px 18px;overflow:auto;font-size:13px;line-height:1.55}
.mdl h4{margin:14px 0 4px;font-size:13px}.mdl code{font:12px var(--mono);background:#f1f4f8;padding:1px 4px;border-radius:3px}
.edit{height:24px;font:13px var(--font);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
</style></head>
<body><div id="app">
<div id="top">
 <div class="logo"><svg viewBox="0 0 512 512" width="100%" height="100%" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#EA580C"/><path d="M236 168A100 100 0 1 0 236 344M424 160H316V352H424M316 256H404" fill="none" stroke="#FFF7ED" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span id="docname" title="Click to rename">sketch</span>
 <button class="tb" id="bFile">File ▾</button><button class="tb" id="bEx">Examples ▾</button><select class="s" id="boardSel" aria-label="Board" title="Board"></select><div class="sep"></div>
 <button class="tb" id="bVerify" title="Check the sketch for mistakes (Ctrl+R)">Verify</button>
 <button class="tb pri" id="bRun" title="Upload and run (F5)">Run<kbd>F5</kbd></button>
 <button class="tb" id="bStop" title="Stop the board (Shift+F5)">Stop</button>
 <button class="tb" id="bReset" title="Press the reset button: the sketch starts again">Reset</button>
 <select class="s" id="speed" aria-label="Simulation speed" title="Simulation speed"><option value="0.1">0.1× speed</option><option value="0.25">0.25× speed</option><option value="0.5">0.5× speed</option><option value="1" selected>Real time</option><option value="2">2× speed</option><option value="5">5× speed</option></select>
 <span id="clock" title="Time on the board since reset"></span>
 <div class="sep"></div><button class="tb" id="bRef">Reference</button>
</div>
<div id="main">
 <div id="left">
  <div id="ed"><div id="gut"><div id="gutIn"></div></div><div id="code"><div id="marks"></div><pre id="hl" aria-hidden="true"></pre><textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Sketch"></textarea></div></div>
  <div id="split" title="Drag to resize"></div>
  <div id="bot">
   <div id="tabs"><button class="tab on" data-p="ser">Serial Monitor</button><button class="tab" data-p="plot">Serial Plotter</button><button class="tab" data-p="vars">Variables</button><button class="tab" data-p="prob">Problems</button></div>
   <div class="pane" id="p-ser"><div id="serOut"></div><div class="serIn"><input type="text" id="serTxt" placeholder="Message to send to the board (Enter)" aria-label="Message to send"><button class="btn pri" id="serSend">Send</button><select class="s" id="serEnd" aria-label="Line ending"><option value="none">No line ending</option><option value="nl" selected>Newline</option><option value="cr">Carriage return</option><option value="both">Both NL and CR</option></select><label><input type="checkbox" id="serAuto" checked>Autoscroll</label><span id="baud" style="font:11.5px var(--mono);color:var(--dim)"></span><button class="btn" id="serClr">Clear</button></div></div>
   <div class="pane" id="p-plot" hidden><canvas id="plot"></canvas></div>
   <div class="pane" id="p-vars" hidden><div id="varv"></div></div>
   <div class="pane" id="p-prob" hidden><div id="probv"></div></div>
  </div>
 </div>
 <div id="right">
  <svg id="board" viewBox="0 0 460 300" role="img" aria-label="Arduino board"></svg>
  <div class="rh"><b>Parts</b><button class="btn" id="bAdd">+ Add part</button></div>
  <div id="parts"></div>
 </div>
</div>
<div id="statusbar"><span id="status"><b>Ready.</b> Press F5 to run the sketch</span><span id="lineInfo"></span><span id="pos">Ln 1, Col 1</span></div>
</div>
<input type="file" id="fileIn" accept=".ino,.cpp,.c,.h,.txt" hidden>
<script src="ino-core.js"></script>
<script src="ino-examples.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const N=window.cesimNative;
const src=$('#src'),hl=$('#hl'),marks=$('#marks'),gutIn=$('#gutIn');
const ST={sim:null,prog:null,running:false,dirty:true,parts:[],name:'sketch',filePath:null,errLines:new Map(),warnLines:new Map(),compiled:null,T:0,lt:0,tab:'ser',plot:[],plotNames:[],serLen:0,uid:1,audio:null};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const PIN=p=>p>=14?'A'+(p-14):String(p);
/* ---------- editor ---------- */
const KW=new Set(['if','else','for','while','do','switch','case','default','break','continue','return','const','static','volatile','unsigned','signed','sizeof','enum','struct','class','true','false','new','delete','goto','inline','typedef','using','namespace','public','private']);
const TY=new Set(['void','int','char','long','short','float','double','bool','boolean','byte','word','String','uint8_t','int8_t','uint16_t','int16_t','uint32_t','int32_t','size_t','Servo','LiquidCrystal','LiquidCrystal_I2C']);
const FN=new Set(['setup','loop','pinMode','digitalWrite','digitalRead','analogRead','analogWrite','delay','delayMicroseconds','millis','micros','map','constrain','min','max','abs','sqrt','pow','random','randomSeed','tone','noTone','pulseIn','Serial','attachInterrupt','detachInterrupt','digitalPinToInterrupt','bitRead','bitWrite','bitSet','bitClear','sin','cos','tan','round','floor','ceil','lcd']);
const CN=new Set(['HIGH','LOW','INPUT','OUTPUT','INPUT_PULLUP','LED_BUILTIN','A0','A1','A2','A3','A4','A5','PI','HEX','DEC','BIN','OCT','RISING','FALLING','CHANGE']);
function hlAll(text){const L=text.split('\n');let inC=false;return L.map(l=>{let o='',i=0;const n=l.length;
 if(!inC&&/^\s*#/.test(l)){const m=l.match(/^(\s*#\s*\w+)(.*)$/);return`<span class="t-p">${esc(m?m[1]:l)}</span>${m?hlFrag(m[2]):''}`}
 while(i<n){if(inC){const j=l.indexOf('*/',i);if(j<0){o+=`<span class="t-c">${esc(l.slice(i))}</span>`;i=n;break}o+=`<span class="t-c">${esc(l.slice(i,j+2))}</span>`;i=j+2;inC=false;continue}
  if(l.startsWith('//',i)){o+=`<span class="t-c">${esc(l.slice(i))}</span>`;break}
  if(l.startsWith('/*',i)){inC=true;continue}
  const c=l[i];if(c==='"'||c==="'"){let j=i+1;while(j<n&&l[j]!==c){if(l[j]==='\\')j++;j++}o+=`<span class="t-s">${esc(l.slice(i,j+1))}</span>`;i=j+1;continue}
  if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(l[i+1]))){let j=i;while(j<n&&/[0-9a-zA-Z_.]/.test(l[j]))j++;o+=`<span class="t-n">${esc(l.slice(i,j))}</span>`;i=j;continue}
  if(/[A-Za-z_]/.test(c)){let j=i;while(j<n&&/\w/.test(l[j]))j++;const w=l.slice(i,j);const cls=KW.has(w)?'t-k':TY.has(w)?'t-ty':CN.has(w)?'t-cn':FN.has(w)?'t-f':'';o+=cls?`<span class="${cls}">${w}</span>`:w;i=j;continue}
  o+=esc(c);i++}
 return o})}
function hlFrag(s){return esc(s).replace(/(&lt;.*?&gt;|"[^"]*")/g,'<span class="t-s">$1</span>')}
function lines(){return src.value.split('\n')}
function curLine(){return ST.sim&&!ST.running&&ST.sim.state==='paused'&&!ST.dirty?ST.sim.ln:0}
function renderEditor(){const H=hlAll(src.value);let h='';H.forEach((x,i)=>{h+=x;const e=ST.errLines.get(i+1),w=ST.warnLines.get(i+1);if(e)h+=`<span class="t-e">    ◂ ${esc(e)}</span>`;else if(w)h+=`<span class="t-w">    ◂ ${esc(w)}</span>`;h+='\n'});hl.innerHTML=h;renderGutter()}
function renderGutter(){const n=lines().length,cur=curLine();let h='';for(let i=1;i<=n;i++){const c=['gl'];if(ST.errLines.has(i))c.push('err');else if(ST.warnLines.has(i))c.push('warn');if(i===cur)c.push('cur');const t=ST.errLines.get(i)||ST.warnLines.get(i);h+=`<div class="${c.join(' ')}"${t?` title="${esc(t)}"`:''}>${i}</div>`}gutIn.innerHTML=h;
 let m='';const add=(l,c)=>{m+=`<div class="mk ${c}" style="top:${8+(l-1)*20}px"></div>`};ST.warnLines.forEach((v,l)=>{if(!ST.errLines.has(l))add(l,'warn')});ST.errLines.forEach((v,l)=>add(l,'err'));if(cur)add(cur,'cur');marks.innerHTML=m;marks.style.height=(n*20+60)+'px'}
function syncScroll(){hl.style.transform=`translate(${-src.scrollLeft}px,${-src.scrollTop}px)`;marks.style.transform=`translate(0,${-src.scrollTop}px)`;gutIn.style.transform=`translateY(${-src.scrollTop}px)`}
src.addEventListener('scroll',syncScroll);
src.addEventListener('input',()=>{ST.dirty=true;refreshButtons();if(ST.errLines.size){ST.errLines=new Map();ST.warnLines=new Map()}renderEditor();syncScroll();saveLocal();updPos()});
src.addEventListener('keydown',e=>{
 if(e.key==='Tab'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();document.execCommand('insertText',false,'  ');return}
 if(e.key==='Enter'&&!e.shiftKey){const s=src.selectionStart,ln=src.value.lastIndexOf('\n',s-1)+1;let ind=(src.value.slice(ln,s).match(/^\s*/)||[''])[0];const before=src.value.slice(ln,s).trimEnd();const after=src.value[s];if(before.endsWith('{'))ind+='  ';e.preventDefault();if(before.endsWith('{')&&after==='}'){document.execCommand('insertText',false,'\n'+ind+'\n'+ind.slice(2));src.selectionStart=src.selectionEnd=s+1+ind.length}else document.execCommand('insertText',false,'\n'+ind);return}
 if(e.key==='}'){const s=src.selectionStart,ln=src.value.lastIndexOf('\n',s-1)+1;const pre=src.value.slice(ln,s);if(/^\s+$/.test(pre)&&pre.length>=2){e.preventDefault();src.setSelectionRange(s-2,s);document.execCommand('insertText',false,'}');return}}
 if((e.ctrlKey||e.metaKey)&&e.key==='/'){e.preventDefault();toggleComment()}});
['keyup','click','select'].forEach(ev=>src.addEventListener(ev,updPos));
function updPos(){const s=src.selectionStart,b=src.value.slice(0,s);$('#pos').textContent=`Ln ${b.split('\n').length}, Col ${s-b.lastIndexOf('\n')}`}
function toggleComment(){const v=src.value;let a=v.lastIndexOf('\n',src.selectionStart-1)+1;let e=v.indexOf('\n',src.selectionEnd);if(e<0)e=v.length;const blk=v.slice(a,e).split('\n');const all=blk.every(l=>/^\s*\/\//.test(l)||!l.trim());const nb=blk.map(l=>all?l.replace(/^(\s*)\/\/\s?/,'$1'):(l.trim()?'// '+l:l)).join('\n');src.setSelectionRange(a,e);document.execCommand('insertText',false,nb);src.setSelectionRange(a,a+nb.length)}

window.cesimOpenText=(name,text,path)=>{loadSketch(text,name.replace(/\.[^.]+$/,''),[],path);toast('Opened '+name)};
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];if(f)window.cesimOpenText(f.name,await f.text(),N&&N.pathFor?N.pathFor(f):null);e.target.value=''});
function sketchText(withParts){let t=src.value.replace(/\n+$/,'')+'\n';if(withParts&&ST.parts.length)t+='\n// cesim-parts: '+JSON.stringify(ST.parts.map(p=>{const o=Object.assign({},p);delete o.id;delete o.pressed;return o}))+'\n';return t}
async function saveFile(asNew){const nm=ST.name.replace(/[^\w.-]+/g,'_')+'.ino';const text=sketchText(true);
 if(N&&N.write&&ST.filePath&&!asNew){await N.write(ST.filePath,text);toast('Saved '+ST.filePath.split(/[\\/]/).pop());return}
 if(N&&N.save){const r=await N.save(nm,text);if(r){ST.filePath=r;setName(r.split(/[\\/]/).pop().replace(/\.[^.]+$/,''));toast('Saved '+r.split(/[\\/]/).pop())}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=nm;document.body.appendChild(a);a.click();a.remove()}
const NEW=`void setup() {\n  // put your setup code here, to run once:\n\n}\n\nvoid loop() {\n  // put your main code here, to run repeatedly:\n\n}\n`;
$('#bFile').onclick=e=>menu(e.currentTarget,[['New sketch',()=>loadSketch(NEW,'sketch',[]),''],['Open…',()=>$('#fileIn').click(),'Ctrl+O'],'-',['Save',()=>saveFile(false),'Ctrl+S'],['Save as…',()=>saveFile(true),'Ctrl+Shift+S'],'-',['Copy the sketch without the parts list',()=>{navigator.clipboard&&navigator.clipboard.writeText(sketchText(false)).then(()=>toast('Copied. Paste it into the Arduino IDE to upload to a real board'))},''],['Copy Serial Monitor text',()=>{navigator.clipboard&&navigator.clipboard.writeText($('#serOut').textContent).then(()=>toast('Copied'))},'']]);
$('#bEx').onclick=e=>menu(e.currentTarget,Object.keys(INO_EXAMPLES).map(k=>[k,()=>{const ex=INO_EXAMPLES[k];loadSketch(ex.code,k.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''),ex.parts);toast('Loaded: '+k+'. Press F5 to run')}]));
$('#docname').onclick=()=>{const el=$('#docname');const inp=document.createElement('input');inp.className='edit';inp.value=ST.name;el.textContent='';el.appendChild(inp);inp.focus();inp.select();let done=false;const fin=ok=>{if(done)return;done=true;setName(ok&&inp.value.trim()?inp.value.trim():ST.name);saveLocal()};inp.onkeydown=e=>{if(e.key==='Enter')fin(true);if(e.key==='Escape')fin(false);e.stopPropagation()};inp.onblur=()=>fin(true)};
$('#bVerify').onclick=()=>verify(false);$('#bRun').onclick=run;$('#bStop').onclick=stop;$('#bReset').onclick=reset;$('#bRef').onclick=showRef;
document.addEventListener('keydown',e=>{const k=e.key;if(k==='F5'){e.preventDefault();if(e.shiftKey)stop();else run()}else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='r'){e.preventDefault();verify(false)}else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='u'){e.preventDefault();ST.dirty=true;run()}else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='s'){e.preventDefault();saveFile(e.shiftKey)}else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='o'){e.preventDefault();$('#fileIn').click()}else if(k==='Escape'){closeMenu();const o=$('.ov');if(o)o.remove()}});
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)window.cesimOpenText(f.name,await f.text(),N&&N.pathFor?N.pathFor(f):null)});
function showRef(){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="mdl" role="dialog" aria-label="Reference"><div class="mh2"><b>Arduino reference</b><button class="btn" id="refX">Close</button></div><div class="mb">
<h4>How it works</h4><p>The sketch runs on a simulated Arduino Uno. <code>setup()</code> runs once, then <code>loop()</code> runs again and again. Time on the board is simulated, so <code>delay()</code> and <code>millis()</code> behave like on the real board. Numbers behave like the real chip too: <code>int</code> is 16-bit (−32768 to 32767), <code>long</code> is 32-bit.</p>
<h4>Pins</h4><p><code>pinMode(pin, OUTPUT / INPUT / INPUT_PULLUP)</code> · <code>digitalWrite</code> · <code>digitalRead</code> · <code>analogRead(A0…A5)</code> gives 0 to 1023 · <code>analogWrite(pin, 0…255)</code> on PWM pins 3, 5, 6, 9, 10, 11 · <code>tone</code> · <code>noTone</code> · <code>pulseIn</code> · <code>attachInterrupt</code> on pins 2 and 3</p>
<h4>Time and maths</h4><p><code>delay</code> · <code>delayMicroseconds</code> · <code>millis</code> · <code>micros</code> · <code>map</code> · <code>constrain</code> · <code>min</code> · <code>max</code> · <code>abs</code> · <code>sq</code> · <code>sqrt</code> · <code>pow</code> · <code>sin</code>/<code>cos</code>/<code>tan</code> · <code>random</code> · <code>randomSeed</code> · <code>bitRead</code> / <code>bitWrite</code> / <code>bitSet</code> / <code>bitClear</code></p>
<h4>Serial</h4><p><code>Serial.begin(9600)</code> · <code>print</code> · <code>println</code> (with <code>HEX</code>, <code>BIN</code> or a number of decimals) · <code>write</code> · <code>available</code> · <code>read</code> · <code>parseInt</code> · <code>parseFloat</code> · <code>readString</code> · <code>readStringUntil</code>. The Serial Plotter draws numbers printed one line at a time.</p>
<h4>Language</h4><p>Types: <code>int</code>, <code>unsigned int</code>, <code>long</code>, <code>unsigned long</code>, <code>byte</code>, <code>char</code>, <code>bool</code>, <code>float</code>, <code>String</code>, arrays (also 2D), <code>const</code>, <code>static</code>, <code>volatile</code>, <code>#define</code>, <code>enum</code>. Functions, recursion, <code>if</code>, <code>for</code>, <code>while</code>, <code>do</code>, <code>switch</code>. Not yet: pointers, references, structs and classes.</p>
<h4>Libraries</h4><p><code>Servo</code>: attach, write, read · <code>LiquidCrystal</code> and <code>LiquidCrystal_I2C</code>: begin, init, backlight, print, setCursor, clear</p>
<h4>Parts</h4><p>Add parts on the right and choose their pins. A button wired to GND needs <code>INPUT_PULLUP</code>: it reads LOW when pressed. When you save, the parts list is kept on the last line of the .ino file as a comment, so the file still works in the Arduino IDE.</p>
<h4>Keys</h4><p>F5 run or pause · Shift+F5 stop · Ctrl+R verify · Ctrl+S save · Ctrl+/ comment lines</p></div></div>`;document.body.appendChild(o);o.onclick=e=>{if(e.target===o||e.target.id==='refX')o.remove()}}
window.addEventListener('beforeunload',()=>{try{localStorage.setItem('cesim.ino.doc',JSON.stringify({name:ST.name,src:src.value,parts:ST.parts.map(p=>{const o=Object.assign({},p);delete o.pressed;return o})}))}catch(e){}});
let svT=null;function saveLocal(){clearTimeout(svT);svT=setTimeout(()=>{try{localStorage.setItem('cesim.ino.doc',JSON.stringify({name:ST.name,src:src.value,parts:ST.parts.map(p=>{const o=Object.assign({},p);delete o.pressed;return o})}))}catch(e){}},300)}
function initBoardSel(){const el=$('#boardSel');el.innerHTML=Object.entries(BOARDS).map(([k,b])=>`<option value="${k}" ${b===BOARD?'selected':''}>${b.name}</option>`).join('');
 el.onchange=()=>{BOARD=BOARDS[el.value];try{localStorage.setItem('cesim.ino.board',el.value)}catch(e){}boardPins();boardSVG();if(typeof renderParts==='function')renderParts();ST.dirty=true;if(ST.running)pause();toast(`Board: ${BOARD.name}. Press Run to upload the sketch to it`)}}
function start(){initBoardSel();boardSVG();let d=null;if(!/blank/.test(location.search)){try{d=JSON.parse(localStorage.getItem('cesim.ino.doc')||'null')}catch(e){}}
 if(d&&typeof d.src==='string'){src.value=d.src;setName(d.name);ST.parts=(d.parts||[]).map(p=>Object.assign({},p,{id:ST.uid++}))}else{const ex=INO_EXAMPLES['Blink'];src.value=ex.code;setName('blink');ST.parts=ex.parts.map(p=>Object.assign({id:ST.uid++},defaults(p.type),p))}
 renderEditor();renderParts();renderProblems();renderAll();refreshButtons();updPos()}
window.CEI={ST,verify,run,pause,stop,reset,loadSketch,showTab,renderAll,get sim(){return ST.sim},src,sketchText};
start();
</script>
<script>/* opened from the System model tool */(function(){let h=null;try{h=JSON.parse(localStorage.getItem("cesim.handoff.open.arduino")||"null");localStorage.removeItem("cesim.handoff.open.arduino")}catch(e){}if(!h||!h.text)return;let n=0;const go=()=>{if(typeof window.cesimOpenText==="function"){window.cesimOpenText(h.name,h.text,null);return}if(++n<60)setTimeout(go,100)};setTimeout(go,250)})();</script>
