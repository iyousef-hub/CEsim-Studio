<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="fonts/fonts.css" rel="stylesheet"><title>CEsim PCB</title>
<style>
:root{--bg:#e9edf2;--panel:#f7f8fa;--line:#cdd3dc;--text:#1b2230;--dim:#5e6979;--hover:#e1e7ef;--accent:#c2410c;--font:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:13px/1.35 var(--font);overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr 28px;height:100%}
#top{display:flex;flex-wrap:wrap;row-gap:2px;align-items:center;gap:2px;padding:4px 10px;min-height:44px;background:var(--panel);border-bottom:1px solid var(--line);user-select:none}
.logo{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font:600 10px var(--mono);margin-right:6px}
#docname{flex:none;font-weight:600;margin-right:10px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;padding:3px 5px;border-radius:3px}#docname:hover{background:var(--hover)}
.tb{flex:none;height:30px;min-width:30px;padding:0 9px;border:1px solid transparent;border-radius:4px;background:none;color:var(--text);cursor:pointer;font:12.5px var(--font);white-space:nowrap}
.tb:hover{background:var(--hover);border-color:var(--line)}.tb.pri{background:var(--accent);color:#fff}.tb.pri:hover{filter:brightness(.93)}.tb.on{background:#dce9f8;border-color:#9dbde4}
.tb kbd{font:10.5px var(--mono);color:var(--dim);margin-left:4px}.tb.pri kbd{color:#d6d3d1}
.sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 6px}
.lay{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex:none}.lay button{height:28px;border:none;background:#fff;padding:0 9px;cursor:pointer;font:12px var(--font);display:flex;align-items:center;gap:5px}.lay button.on{background:#1b2230;color:#fff}.lay i{width:9px;height:9px;border-radius:2px;display:inline-block}
#main{display:grid;grid-template-columns:172px minmax(0,1fr) 290px;min-height:0}
#pal{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:6px 8px 14px;user-select:none}
h3{font:600 11px var(--font);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:10px 2px 6px}
.pi{display:block;width:100%;border:1px solid transparent;background:none;border-radius:5px;padding:5px 7px;cursor:pointer;font:12.5px var(--font);color:var(--text);text-align:left}.pi:hover{background:#fff;border-color:#dde2e9}.pi.on{background:#dce9f8;border-color:#9dbde4}.pi small{display:block;color:var(--dim);font-size:11px}.palq{width:100%;box-sizing:border-box;margin:6px 0 4px;padding:5px 7px;border:1px solid #d5dbe3;border-radius:5px;font:12.5px var(--font)}details.pg>summary{cursor:pointer;font-size:12.5px;padding:4px 2px;color:var(--text)}details.pg>summary small{color:var(--dim)}details.pg{margin-left:2px}
#stage{position:relative;overflow:hidden;background:#0b1220}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#hint{position:absolute;left:12px;top:10px;background:rgba(15,22,36,.85);color:#dbe4f0;border-radius:6px;padding:6px 10px;font-size:12px;pointer-events:none;max-width:65%}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}#zoom button{width:30px;height:30px;border:1px solid #2b3648;background:#162033;color:#dbe4f0;border-radius:5px;cursor:pointer;font-size:15px}
#side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:4px 12px 16px}
.card{background:#fff;border:1px solid #dde2e9;border-radius:8px;padding:9px 10px;margin-bottom:8px}.card b{font-size:13px}.sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.fld{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--dim)}.fld label{min-width:70px}
.fld input,.fld select{flex:1;min-width:0;height:26px;border:1px solid var(--line);border-radius:4px;padding:0 6px;font:12.5px var(--font);background:#fff}.fld input.sm{flex:none;width:64px}
.btn{height:26px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text);cursor:pointer;font:12px var(--font)}.btn:hover{background:var(--hover)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.red{color:#b3261e}
.pads{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;margin-top:8px;font-size:12px}.pads input{height:24px;border:1px solid var(--line);border-radius:4px;padding:0 5px;font:12px var(--mono);min-width:0}
.prob{display:flex;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12px;line-height:1.4}.prob:hover{background:#fff}.prob i{font-style:normal;flex:none}.prob.w i{color:#b07b00}.prob.e i{color:#c62828}
.netrow{display:flex;justify-content:space-between;padding:3px 8px;border-radius:4px;cursor:pointer;font:12px var(--mono)}.netrow:hover{background:#fff}.netrow.on{background:#fff4c2}.netrow span{color:var(--dim);font-family:var(--font)}
#statusbar{display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden}#status b{color:var(--text)}#status.err b{color:#b3261e}#status.ok b{color:#1f7a37}#coord{margin-left:auto;font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#1b2230;color:#fff;padding:9px 14px;border-radius:6px;font-size:12.5px;z-index:90;max-width:70vw}.toast.warn{background:#8a3a00}
.menu{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(20,30,50,.18);padding:4px;min-width:250px;display:flex;flex-direction:column}
.menu button{display:flex;justify-content:space-between;gap:20px;border:none;background:none;text-align:left;padding:7px 10px;font:12.5px var(--font);border-radius:4px;cursor:pointer;color:var(--text)}.menu button:hover{background:#eaf3ff}.menu button span{color:var(--dim)}.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.ov{position:fixed;inset:0;background:rgba(15,20,30,.35);display:grid;place-items:center;z-index:70}
.mdl{background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(760px,92vw);max-height:86vh;display:flex;flex-direction:column}.mdl .mh2{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}.mdl .mb{padding:10px 18px 16px;overflow:auto;font-size:13px;line-height:1.55}.mdl h4{margin:12px 0 4px;font-size:13px}.mdl .mf{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
.mdl textarea{width:100%;height:280px;font:12.5px/1.5 var(--mono);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.edit{height:24px;font:13px var(--font);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}[hidden]{display:none!important}
</style></head>
<body><div id="app">
<div id="top">
 <div class="logo"><svg viewBox="0 0 512 512" width="100%" height="100%" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#EA580C"/><path d="M236 168A100 100 0 1 0 236 344M424 160H316V352H424M316 256H404" fill="none" stroke="#FFF7ED" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span id="docname" title="Click to rename">board</span>
 <button class="tb" id="bFile">File ▾</button><button class="tb" id="bEx">Examples ▾</button><button class="tb" id="bUndo" title="Undo (Ctrl+Z)">↶</button><button class="tb" id="bRedo" title="Redo (Ctrl+Y)">↷</button><div class="sep"></div>
 <button class="tb on" id="tSel" title="Select and move (S)">Select<kbd>S</kbd></button><button class="tb" id="tRoute" title="Draw tracks (X)">Route<kbd>X</kbd></button>
 <div class="lay" title="Active copper layer (L switches)"><button id="lF" class="on"><i style="background:#d64545"></i>Top</button><button id="lB"><i style="background:#3f7ee8"></i>Bottom</button></div>
 <button class="tb" id="bNet" title="Edit or import the netlist">Netlist</button><div class="sep"></div>
 <button class="tb pri" id="bAuto" title="Route every connection automatically">Autoroute</button><button class="tb" id="bDrc" title="Check the design rules">Check (DRC)</button>
 <button class="tb" id="bView" title="Switch between layer view and the finished board">Real view</button><button class="tb" id="bGerber" title="Export Gerber and drill files for manufacturing">Export Gerber</button><button class="tb" id="bRef">Reference</button>
</div>
<div id="main">
 <div id="pal"></div>
 <div id="stage"><canvas id="cv" aria-label="PCB layout"></canvas><div id="hint" hidden></div><div id="zoom"><button id="zIn" title="Zoom in">+</button><button id="zOut" title="Zoom out">−</button><button id="zFit" title="Fit">⤢</button></div></div>
 <div id="side"></div>
</div>
<div id="statusbar"><span id="status"><b>Ready.</b></span><span id="stats"></span><span id="coord"></span></div>
</div>
<input type="file" id="fileIn" accept=".cepcb,.json,.zip,.gbr,.ger,.gtl,.gbl,.gko,.gm1,.drl,.xln" multiple hidden><input type="file" id="netIn" accept=".cir,.net,.txt,.sp,.spice" hidden>
<script src="parts-lib.js"></script>
<script src="pcb-core.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const N=window.cesimNative;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ST={doc:null,name:'board',filePath:null,tool:'select',layer:'F',sel:null,route:null,placing:null,undo:[],redo:[],view:{s:12,ox:40,oy:40},real:false,flip:false,grid:0.635,hiNet:null,drc:null,cursor:[0,0],diagFirst:false};
const cv=$('#cv'),cx=cv.getContext('2d');
function emptyDoc(){return{board:{w:50.8,h:38.1},comps:[],nets:{},traces:[],vias:[],texts:[],rules:{...PCB.DEF_RULES}}}
/* ---------- view ---------- */
function size(){const r=cv.getBoundingClientRect();const d=devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);draw()}
new ResizeObserver(size).observe(cv);
const W2S=(x,y)=>{const v=ST.view;const xx=ST.flip?ST.doc.board.w-x:x;return[v.ox+xx*v.s,v.oy+y*v.s]};
const S2W=(px,py)=>{const v=ST.view;let x=(px-v.ox)/v.s;if(ST.flip)x=ST.doc.board.w-x;return[x,(py-v.oy)/v.s]};
function evPos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function fit(){const r=cv.getBoundingClientRect();const b=ST.doc.board;let x0=0,y0=0,x1=b.w,y1=b.h;for(const c of ST.doc.comps){const bb=PCB.compBox(c);x0=Math.min(x0,bb[0]);y0=Math.min(y0,bb[1]);x1=Math.max(x1,bb[2]);y1=Math.max(y1,bb[3])}const m=4;const s=Math.min((r.width-40)/(x1-x0+2*m),(r.height-40)/(y1-y0+2*m));const s2=Math.max(2,Math.min(80,s));ST.view={s:s2,ox:(r.width-(x1-x0)*s2)/2-(ST.flip?b.w-x1:x0)*s2,oy:(r.height-(y1-y0)*s2)/2-y0*s2};draw()}
function zoomAt(f,px,py){const r=cv.getBoundingClientRect();if(px==null){px=r.width/2;py=r.height/2}const v=ST.view;const ns=Math.max(1.5,Math.min(200,v.s*f));const k=ns/v.s;ST.view={s:ns,ox:px-(px-v.ox)*k,oy:py-(py-v.oy)*k};draw()}
const snapG=v=>Math.round(v/ST.grid)*ST.grid;
/* ---------- drawing ---------- */
const COL={F:'#d64545',B:'#3f7ee8',pad:'#c8a640',silk:'#e8e3a8',edge:'#e8c547',rat:'rgba(255,255,255,.75)',hole:'#0b1220',sel:'#ffffff',drc:'#ff4fd8'};
let items=null,clus=null;function recompute(){items=PCB.copper(ST.doc);clus=PCB.clusters(items);ST.drc=PCB.drc(ST.doc);updStats()}
function draw(){if(!ST.doc)return;const d=devicePixelRatio||1;cx.setTransform(d,0,0,d,0,0);const r=cv.getBoundingClientRect();cx.clearRect(0,0,r.width,r.height);const v=ST.view,s=v.s,doc=ST.doc,b=doc.board;
 const P=(x,y)=>W2S(x,y);
 // grid dots
 if(!ST.real&&s*ST.grid>=7){cx.fillStyle='rgba(255,255,255,.08)';const g=ST.grid;for(let x=0;x<=b.w+1e-6;x+=g)for(let y=0;y<=b.h+1e-6;y+=g){const[a,c]=P(x,y);cx.fillRect(a-0.5,c-0.5,1,1)}}
 // board
 const[bx0,by0]=P(0,0),[bx1,by1]=P(b.w,b.h);const L=Math.min(bx0,bx1),T=Math.min(by0,by1),Wd=Math.abs(bx1-bx0),Hd=Math.abs(by1-by0);
 if(ST.real){cx.fillStyle='#1f6b3a';cx.fillRect(L,T,Wd,Hd)}else{cx.fillStyle='#101a2b';cx.fillRect(L,T,Wd,Hd)}cx.strokeStyle=ST.real?'#c9b37a':COL.edge;cx.lineWidth=ST.real?2:1.4;cx.strokeRect(L,T,Wd,Hd);
 const hi=ST.hiNet;const order=ST.real?[ST.flip?'F':'B',ST.flip?'B':'F']:(ST.layer==='F'?['B','F']:['F','B']);
 const lineCap=(a,bb,w,col)=>{cx.strokeStyle=col;cx.lineWidth=Math.max(1,w*s);cx.lineCap='round';cx.beginPath();cx.moveTo(...P(...a));cx.lineTo(...P(...bb));cx.stroke()};
 const padPath=(p,grow)=>{const sh=PCB.padShape({...p,w:p.w+2*(grow||0),h:p.h+2*(grow||0)});cx.beginPath();if(sh.k==='box'){const[a,c]=P(sh.x0,sh.y0),[e,f]=P(sh.x1,sh.y1);cx.rect(Math.min(a,e),Math.min(c,f),Math.abs(e-a),Math.abs(f-c))}else{const[a,c]=P(...sh.a),[e,f]=P(...sh.b);if(a===e&&c===f)cx.arc(a,c,sh.r*s,0,7);else{cx.lineCap='round';cx.lineWidth=sh.r*2*s;cx.moveTo(a,c);cx.lineTo(e,f);return'stroke'}}return'fill'};
 const fillPad=(p,col,grow)=>{const m=padPath(p,grow);if(m==='stroke'){cx.strokeStyle=col;cx.stroke()}else{cx.fillStyle=col;cx.fill()}};
 const visible=layer=>!ST.real||layer===(ST.flip?'B':'F');
 for(const layer of order){if(ST.real&&!visible(layer))continue;const dim=!ST.real&&layer!==ST.layer;
  for(const t of doc.traces)if(t.layer===layer){let col=ST.real?'#2f8a4c':COL[layer];if(!ST.real&&hi&&t.net===hi)col=layer==='F'?'#ff8a8a':'#8ab4ff';cx.globalAlpha=dim?.55:1;lineCap(t.a,t.b,t.w,col)}cx.globalAlpha=1}
 // pads
 if(!items)recompute();
 for(const it of items){if(it.kind!=='pad')continue;const p=it.p;if(ST.real&&!it.layers.includes(ST.flip?'B':'F'))continue;let col=ST.real?'#d8d8d2':(p.drill?COL.pad:(ST.layer==='F'?COL.F:'#8a3a3a'));if(!ST.real&&hi&&it.net===hi)col='#ffe27a';fillPad(p,col)}
 for(const vv of doc.vias){const[a,c]=P(vv.x,vv.y);cx.fillStyle=ST.real?'#2f8a4c':(hi&&vv.net===hi?'#ffe27a':'#b9b9b9');cx.beginPath();cx.arc(a,c,vv.d/2*s,0,7);cx.fill()}
 // holes
 cx.fillStyle=ST.real?'#121212':COL.hole;for(const it of items)if(it.kind==='pad'&&it.p.drill){const[a,c]=P(it.p.x,it.p.y);cx.beginPath();cx.arc(a,c,it.p.drill/2*s,0,7);cx.fill()}for(const vv of doc.vias){const[a,c]=P(vv.x,vv.y);cx.beginPath();cx.arc(a,c,vv.drill/2*s,0,7);cx.fill()}
 // silk
 if(!ST.real||!ST.flip){cx.strokeStyle=ST.real?'#f4f4f0':COL.silk;cx.lineWidth=Math.max(1,0.15*s);cx.lineCap='round';cx.lineJoin='round';
  for(const c of doc.comps){if(!ST.real){const f=PCB.FP[c.fp];}for(const pl of PCB.silkOf(c)){cx.beginPath();pl.forEach((q,i)=>{const[a,e]=P(...q);i?cx.lineTo(a,e):cx.moveTo(a,e)});cx.stroke()}const[rx,ry]=PCB.refPos(c);const fs=1.0;for(const pl of PCB.textStrokes(c.ref,rx,ry,fs,0)){cx.beginPath();pl.forEach((q,i)=>{const[a,e]=P(...(ST.flip?[2*rx-q[0],q[1]]:q));i?cx.lineTo(a,e):cx.moveTo(a,e)});cx.stroke()}}
  for(const tx of doc.texts||[])for(const pl of PCB.textStrokes(tx.text,tx.x,tx.y,tx.size||1.5,0)){cx.beginPath();pl.forEach((q,i)=>{const[a,e]=P(...q);i?cx.lineTo(a,e):cx.moveTo(a,e)});cx.stroke()}}
 if(!ST.real){// values, pad names when zoomed
  cx.fillStyle='rgba(232,227,168,.6)';cx.font=`${Math.max(9,Math.min(13,0.9*s))}px IBM Plex Sans`;cx.textAlign='center';for(const c of doc.comps){if(s<6||!c.value)continue;const bb=PCB.compBox(c);const[a,e]=P((bb[0]+bb[2])/2,bb[3]+1.1);cx.fillText(c.value,a,e)}
  if(s>=14){cx.fillStyle='#0b1220';cx.font=`600 ${Math.min(12,0.55*s)}px IBM Plex Mono`;cx.textBaseline='middle';for(const it of items)if(it.kind==='pad'){const[a,e]=P(it.p.x,it.p.y);cx.fillText(it.pad,a,e+(it.p.drill?it.p.drill*s*0.75:0))}cx.textBaseline='alphabetic'}
  // ratsnest
  cx.strokeStyle=COL.rat;cx.lineWidth=1;cx.setLineDash([]);for(const l of ST.drc?ST.drc.ratsnest:[]){cx.globalAlpha=hi&&l.net!==hi?.25:1;cx.beginPath();cx.moveTo(...P(...l.a));cx.lineTo(...P(...l.b));cx.stroke()}cx.globalAlpha=1;
  // DRC markers
  if(ST.showDrc&&ST.drc){for(const q of ST.drc.items){if(q.kind==='unrouted')continue;const[a,e]=P(...q.at);cx.strokeStyle=q.sev==='error'?COL.drc:'#ffb020';cx.lineWidth=2;cx.beginPath();cx.arc(a,e,Math.max(7,0.8*s),0,7);cx.stroke()}}}
 // selection
 if(ST.multi){const M=ST.multi;cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.setLineDash([4,3]);for(const i of M.comps){const c=doc.comps[i];if(!c)continue;const bb=PCB.compBox(c);const[a,e]=P(bb[0],bb[1]),[f,g]=P(bb[2],bb[3]);cx.strokeRect(Math.min(a,f),Math.min(e,g),Math.abs(f-a),Math.abs(g-e))}
  cx.setLineDash([]);cx.globalAlpha=.35;for(const i of M.traces){const t=doc.traces[i];if(!t)continue;cx.strokeStyle='#fff';cx.lineWidth=Math.max(1,t.w*s)+3;cx.beginPath();cx.moveTo(...P(...t.a));cx.lineTo(...P(...t.b));cx.stroke()}cx.globalAlpha=1;
  for(const i of M.vias){const vv=doc.vias[i];if(!vv)continue;const[a,e]=P(vv.x,vv.y);cx.beginPath();cx.arc(a,e,vv.d/2*s+3,0,7);cx.stroke()}}
 if(ST.band){const B_=ST.band;const[a,e]=P(...B_.a),[f,g]=P(...B_.b);cx.save();cx.fillStyle='rgba(120,180,255,.12)';cx.strokeStyle='#9cc8ff';cx.lineWidth=1;cx.setLineDash([]);cx.fillRect(Math.min(a,f),Math.min(e,g),Math.abs(f-a),Math.abs(g-e));cx.strokeRect(Math.min(a,f),Math.min(e,g),Math.abs(f-a),Math.abs(g-e));cx.restore()}
 const sel=ST.sel;if(sel){cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.setLineDash([4,3]);if(sel.comp!=null){const c=doc.comps[sel.comp];if(c){const bb=PCB.compBox(c);const[a,e]=P(bb[0],bb[1]),[f,g]=P(bb[2],bb[3]);cx.strokeRect(Math.min(a,f),Math.min(e,g),Math.abs(f-a),Math.abs(g-e))}}if(sel.trace!=null){const t=doc.traces[sel.trace];if(t){cx.setLineDash([]);cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=Math.max(1,t.w*s)+3;cx.globalAlpha=.35;cx.beginPath();cx.moveTo(...P(...t.a));cx.lineTo(...P(...t.b));cx.stroke();cx.globalAlpha=1}}if(sel.via!=null){const vv=doc.vias[sel.via];if(vv){const[a,e]=P(vv.x,vv.y);cx.beginPath();cx.arc(a,e,vv.d/2*s+3,0,7);cx.stroke()}}cx.setLineDash([])}
 // routing preview

<h4>From circuit to board</h4><p>A board starts from a netlist: which pin of which part connects to which. Bring one from the Breadboard or the Circuit tool, write it in Netlist, or place parts from the left and type each pad's net in the panel. Thin white lines (the ratsnest) show connections that still need copper.</p>
<h4>Placing</h4><p>Drag parts to move them, R rotates. Put parts that connect close together, and keep connectors at the edge. Drag the yellow square at the board corner, or type a size, to resize the board.</p>
<h4>Routing</h4><p>Press X, click a pad and click to add corners; tracks run straight or at 45°. / flips the corner, V drops a via and continues on the other layer, Backspace undoes the last corner, and a click on a pad of the same net finishes. You cannot end a track on a pad of another net. L switches between the top (red) and bottom (blue) copper. Autoroute routes everything that is left.</p>
<h4>Design rules</h4><p>Check (DRC) looks for copper of different nets that is too close or touching (a short), tracks thinner than the minimum, copper near the edge, overlapping parts and connections not routed yet. Click a problem to jump to it.</p>
<h4>Manufacturing</h4><p>Export Gerber writes a .zip with the top and bottom copper, solder mask, silkscreen and board outline in Gerber RS-274X, plus the drill file in Excellon. Board makers accept this .zip as it is.</p>
<h4>Keys</h4><p>S select · X route · L change layer · V via · R rotate · Delete remove · Ctrl+Z undo · mouse wheel zoom · drag the background or use the middle button to move the view</p></div></div>`;document.body.appendChild(o);o.onclick=e=>{if(e.target===o||e.target.id==='refX')o.remove()}}
