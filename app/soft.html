<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="fonts/fonts.css" rel="stylesheet"><title>CEsim Software design</title>
<style>
:root{--bg:#eef1f5;--panel:#f7f8fa;--line:#cdd3dc;--text:#1b2230;--dim:#5e6979;--hover:#e1e7ef;--accent:#185fa5;--font:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:13px/1.4 var(--font);display:flex;flex-direction:column;overflow:hidden}
#top{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 10px var(--mono)}
.title{font-weight:600;margin-right:6px}
.btn{height:30px;padding:0 11px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--text);cursor:pointer;font:12.5px var(--font);white-space:nowrap}.btn:hover{background:var(--hover)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.on{background:#d3e4f7;border-color:#93b8e0}
.btn:disabled{opacity:.45;cursor:default}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
input.nm{height:30px;border:1px solid var(--line);border-radius:5px;padding:0 9px;font:600 13px var(--font);width:190px}
select.sl{height:30px;border:1px solid var(--line);border-radius:5px;padding:0 6px;font:12.5px var(--font);background:#fff}
#tabs{display:flex;align-items:flex-end;gap:2px;padding:5px 10px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.dt{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:#e8ecf1;cursor:pointer;font-size:12.5px;white-space:nowrap;color:var(--dim)}
.dt.on{background:#fff;color:var(--text);font-weight:600;margin-bottom:-1px;height:31px}.dt small{font-weight:400;color:var(--dim);font-size:11px}
.dt .x{border:0;background:none;cursor:pointer;color:#8a94a3;font-size:15px;line-height:1;padding:1px 5px;border-radius:4px}.dt .x:hover{background:#fde8e8;color:#b3261e}
#addTab{height:28px;margin-bottom:2px;border:1px dashed #9aa6b6;background:none;border-radius:6px;padding:0 10px;cursor:pointer;font:12.5px var(--font);color:var(--accent)}
#body{flex:1;display:grid;grid-template-columns:210px minmax(0,1fr) 300px;min-height:0}
#pal{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px 10px 16px}
#pal h3{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin:12px 2px 6px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pi{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 4px 5px;cursor:pointer;font:11px/1.2 var(--font);color:var(--text);text-align:center;min-height:66px}.pi:hover{border-color:#93b8e0;background:#f5f9fe}.pi.on{background:#d3e4f7;border-color:#5b8fd0}
.pi svg{width:72px;height:36px}
.pl{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:none;border-radius:6px;padding:4px 6px;cursor:pointer;font:12px var(--font);color:var(--text);text-align:left}.pl:hover{background:#fff;border-color:var(--line)}.pl.on{background:#d3e4f7;border-color:#93b8e0}
.pl svg{width:56px;height:18px;flex:none}
#cv{position:relative;overflow:hidden;background:#fbfcfd;background-image:radial-gradient(#d9dee6 1px,transparent 1px);background-size:20px 20px;outline:none}
#cv svg#S{position:absolute;inset:0;width:100%;height:100%;user-select:none}
#cv.conn{cursor:crosshair}
.nd{cursor:move}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
#zoom .btn{height:28px;width:30px;padding:0}
#hint{position:absolute;left:10px;bottom:10px;font-size:11.5px;color:var(--dim);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:5px;pointer-events:none;max-width:70%}
#insp{border-left:1px solid var(--line);background:#fff;overflow:auto;padding:12px 14px 20px}
#insp h4{margin:0 0 8px;font-size:13px}#insp .k{font-size:11.5px;color:var(--dim);margin:-4px 0 10px}
.fl{display:block;font-size:11.5px;color:var(--dim);margin:10px 0 3px}
.fi,.ft,.fs{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px 7px;font:12.5px var(--font);color:var(--text);background:#fff}
.ft{font:12px/1.5 var(--mono);min-height:80px;resize:vertical}
.fc{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:12.5px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
table.cols{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:4px}
.cols th{font-weight:500;color:var(--dim);text-align:left;padding:2px 2px;font-size:10.5px}
.cols td{padding:1px 1px}
.cols input[type=text]{width:100%;border:1px solid var(--line);border-radius:4px;padding:3px 4px;font:11.5px var(--mono)}
.cols select{width:100%;border:1px solid var(--line);border-radius:4px;padding:2px;font:11px var(--font);max-width:84px}
.cols .del{border:0;background:none;color:#8a94a3;cursor:pointer;font-size:14px;padding:0 3px}.cols .del:hover{color:#b3261e}
.chk{list-style:none;padding:0;margin:6px 0 0}.chk li{padding:6px 8px;border-radius:6px;margin-bottom:4px;font-size:12px;cursor:pointer;border:1px solid transparent}.chk li:hover{border-color:var(--line)}
.chk .error{background:#fdecec;color:#8c1d18}.chk .warn{background:#fff6e0;color:#7a4b00}.chk .info{background:#eef4fc;color:#1d4f86}.chk .ok{background:#e9f7ee;color:#1f6b3a}
.menu{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 8px 24px rgba(16,24,40,.16);padding:4px;min-width:210px;max-height:80vh;overflow:auto}
.menu button{display:flex;justify-content:space-between;gap:14px;width:100%;border:0;background:none;text-align:left;padding:6px 10px;border-radius:5px;cursor:pointer;font:12.5px var(--font);color:var(--text)}.menu button:hover{background:var(--hover)}.menu .mh{font-size:11px;color:var(--dim);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.04em}.menu hr{border:0;border-top:1px solid #eef1f4;margin:4px 0}
.menu button small{color:var(--dim)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.35);display:grid;place-items:center;z-index:70}
.mdl{background:#fff;border-radius:10px;width:min(860px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mdl .mh2{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #eef1f4}.mdl .mh2 b{flex:1}
.mdl textarea{flex:1;min-height:360px;border:0;padding:12px 14px;font:12px/1.5 var(--mono);resize:none;outline:none}
.mdl .mf{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid #eef1f4;align-items:center}.mdl .mf .note{flex:1;font-size:11.5px;color:var(--dim)}
.picker{padding:12px 16px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.picker h5{grid-column:1/-1;margin:6px 0 -4px;font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.pk{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff;text-align:left;font:12.5px var(--font)}.pk:hover{border-color:#5b8fd0;background:#f5f9fe}.pk b{display:block;margin-bottom:3px}.pk span{color:var(--dim);font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2230;color:#fff;padding:9px 14px;border-radius:6px;font-size:12.5px;z-index:90;max-width:80vw}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
</style></head><body>
<div id="top"><div class="logo">CE</div><span class="title">Software design</span>
 <input class="nm" id="pname" aria-label="Project name" spellcheck="false">
 <button class="btn" id="bNew">New</button><button class="btn" id="bOpen">Open</button><button class="btn" id="bSave">Save</button><button class="btn" id="bEx">Examples ▾</button>
 <span class="sep"></span><button class="btn" id="bUndo" title="Undo (Ctrl+Z)">Undo</button><button class="btn" id="bRedo" title="Redo (Ctrl+Y)">Redo</button><button class="btn" id="bDel" title="Delete (Del)">Delete</button>
 <span class="sep"></span><button class="btn" id="bLayout" title="Arrange the shapes again">Arrange</button><button class="btn" id="bOrtho" title="Draw lines with right angles">Right angles</button>
 <select class="sl" id="notation" aria-label="Notation" title="Notation"></select>
 <button class="btn" id="bCheck">Check</button>
 <span class="sep"></span><button class="btn" id="bImp">Import ▾</button><button class="btn pri" id="bExp">Export ▾</button>
 <input type="file" id="fileIn" accept=".cesoft,.json,.sql,.txt,.java,.cs,.py,.ts,.h,.hpp,.cpp" hidden>
</div>
<div id="tabs"></div>
<div id="body">
 <aside id="pal" aria-label="Shapes"></aside>
 <section id="cv" tabindex="0"><svg id="S" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif"><g id="W"></g><g id="Wx"></g></svg>
  <div id="hint"></div><div id="zoom"><button class="btn" id="zOut" title="Zoom out">−</button><button class="btn" id="zFit" title="Fit">⤢</button><button class="btn" id="zIn" title="Zoom in">+</button></div></section>
 <aside id="insp" aria-label="Properties"></aside>
</div>
<script src="soft-core.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const N=window.cesimNative;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,bad){$$('.toast').forEach(t=>t.remove());const d=document.createElement('div');d.className='toast';if(bad)d.style.background='#8c1d18';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}
const KEY='cesim.soft';
let DOC=null,filePath=null;const ST={sel:new Set(),view:{s:1,ox:40,oy:40},conn:null,lastEdge:{},undo:[],redo:[],drag:null,checks:null,clip:null};
const dg=()=>DOC.diagrams.find(d=>d.id===DOC.active)||DOC.diagrams[0];
const NODE=id=>dg().nodes.find(n=>n.id===id),EDGE=id=>dg().edges.find(e=>e.id===id);
/* ---------- history ---------- */
function snap(){ST.undo.push(JSON.stringify(DOC));if(ST.undo.length>200)ST.undo.shift();ST.redo=[]}
function undo(){if(!ST.undo.length)return;ST.redo.push(JSON.stringify(DOC));DOC=JSON.parse(ST.undo.pop());ST.sel.clear();full()}
function redo(){if(!ST.redo.length)return;ST.undo.push(JSON.stringify(DOC));DOC=JSON.parse(ST.redo.pop());ST.sel.clear();full()}
function store(){try{localStorage.setItem(KEY,JSON.stringify(DOC))}catch(e){}}
/* ---------- drawing ---------- */
let RES=null;
function draw(){const d=dg();RES=SOFT.render(d,{sel:ST.sel});$('#W').innerHTML=RES.svg;applyView();handles();store();$('#bUndo').disabled=!ST.undo.length;$('#bRedo').disabled=!ST.redo.length}
function applyView(){const v=ST.view;$('#W').setAttribute('transform',`translate(${v.ox} ${v.oy}) scale(${v.s})`);$('#Wx').setAttribute('transform',`translate(${v.ox} ${v.oy}) scale(${v.s})`)}
function handles(){let s='';const d=dg();if(ST.sel.size===1&&!SOFT.TYPES[d.type].special){const n=NODE([...ST.sel][0]);if(n&&RES.boxes[n.id]){const b=RES.boxes[n.id];s=`<g data-link="${n.id}" style="cursor:crosshair"><circle cx="${b.x+b.w+14}" cy="${b.y+b.h/2}" r="7" fill="#2563eb"/><path d="M${b.x+b.w+10} ${b.y+b.h/2}h8m-3 -3l3 3l-3 3" stroke="#fff" stroke-width="1.4" fill="none"/></g>`}}$('#Wx').innerHTML=s}
function fit(){const d=dg();const r=SOFT.render(d,{});const [x,y,w,h]=r.vb;const R0=$('#cv').getBoundingClientRect();const s=Math.min(1.6,Math.max(.2,Math.min((R0.width-40)/w,(R0.height-40)/h)));ST.view={s,ox:(R0.width-w*s)/2-x*s,oy:(R0.height-h*s)/2-y*s};applyView()}
function toWorld(e){const r=$('#cv').getBoundingClientRect();return[(e.clientX-r.left-ST.view.ox)/ST.view.s,(e.clientY-r.top-ST.view.oy)/ST.view.s]}
function zoomAt(f,cx,cy){const r=$('#cv').getBoundingClientRect();if(cx==null){cx=r.width/2;cy=r.height/2}const v=ST.view;const ns=Math.min(4,Math.max(.15,v.s*f));v.ox=cx-(cx-v.ox)*ns/v.s;v.oy=cy-(cy-v.oy)*ns/v.s;v.s=ns;applyView()}
/* ---------- tabs ---------- */
function tabs(){$('#tabs').innerHTML=DOC.diagrams.map(d=>`<div class="dt${d.id===DOC.active?' on':''}" data-d="${d.id}" title="${esc(SOFT.TYPES[d.type].name)}">${esc(d.name)} <small>${esc(SOFT.TYPES[d.type].name.replace(/ diagram$/,''))}</small>${DOC.diagrams.length>1?`<button class="x" data-close="${d.id}" title="Remove this diagram">×</button>`:''}</div>`).join('')+'<button id="addTab" title="Add a diagram">+ Diagram</button>';
 $$('.dt').forEach(t=>t.onclick=e=>{if(e.target.dataset.close){const id=e.target.dataset.close;const d=DOC.diagrams.find(x=>x.id===id);if((d.nodes.length||d.edges.length)&&!confirm(`Remove the diagram "${d.name}"?`))return;snap();DOC.diagrams=DOC.diagrams.filter(x=>x.id!==id);if(DOC.active===id)DOC.active=DOC.diagrams[0].id;ST.sel.clear();full(true);return}if(DOC.active!==t.dataset.d){DOC.active=t.dataset.d;ST.sel.clear();ST.conn=null;full(true)}});
 $$('.dt').forEach(t=>t.ondblclick=()=>{const d=DOC.diagrams.find(x=>x.id===t.dataset.d);const nm=prompt('Diagram name',d.name);if(nm&&nm.trim()){snap();d.name=nm.trim();full()}});
 $('#addTab').onclick=()=>pickType(t=>{snap();const d=SOFT.newDiagram(t);DOC.diagrams.push(d);DOC.active=d.id;ST.sel.clear();full(true)})}
function pickType(cb,withExample){const o=document.createElement('div');o.className='ov';const grp={};for(const k in SOFT.TYPES)(grp[SOFT.TYPES[k].grp]=grp[SOFT.TYPES[k].grp]||[]).push(k);
 const DESC={class:'Classes, interfaces and how they relate',object:'Objects and their values at one moment',component:'Parts of a system and the interfaces between them',deployment:'Where the software runs: devices, servers, databases',package:'How the code is grouped and which group uses which',composite:'The inside of a class: its parts, ports and connectors',profile:'Stereotypes that extend UML for one field',usecase:'What users can do with the system',activity:'Steps, decisions and parallel work',state:'States of one thing and what moves it between them',sequence:'Messages between objects in time order',communication:'Messages between linked objects, numbered',timing:'How states change along a time line',overview:'Interactions joined by a flow of control',er:"Tables, keys and relationships (Chen, crow's foot, IDEF1X)",dfd:'How data moves between processes and stores',c4:'Context and container views of a software system',bpmn:'Business processes: events, tasks, gateways, pools'};
 o.innerHTML=`<div class="mdl" role="dialog" aria-label="New diagram"><div class="mh2"><b>${withExample?'Open an example':'Add a diagram'}</b><button class="btn" id="pkX">Close</button></div><div class="picker">${Object.keys(grp).map(g=>`<h5>${esc(g)}</h5>`+grp[g].map(k=>`<button class="pk" data-t="${k}"><b>${esc(SOFT.TYPES[k].name)}</b><span>${esc(DESC[k]||'')}</span></button>`+(withExample&&k==='sequence'?`<button class="pk" data-t="booking"><b>Sequence: booking platform</b><span>Numbered messages, an alt fragment and lifeline heads at both ends</span></button>`:'')).join('')).join('')}</div></div>`;
 document.body.appendChild(o);o.querySelector('#pkX').onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove();const b=e.target.closest('[data-t]');if(b){o.remove();cb(b.dataset.t)}}}
/* ---------- palette ---------- */
const THUMB={};
function thumb(type,kind){const key=type+'|'+kind;if(THUMB[key])return THUMB[key];const d=SOFT.newDiagram(type);const nm={class:'Class',abstract:'Shape',interface:'IShape',enum:'Color',actor:'User',usecase:'Use case',action:'Action',state:'State',entity:'Table',process:'Process',extent:'Entity',store:'Store',task:'Task',person:'User',system:'System',extsystem:'System',container:'Container',c4db:'Database',c4comp:'Component',note:'Note',component:'Component',artifact:'app.jar',object:'obj : Class',part:'p : Part',lifeline:'obj',lactor:'User',lboundary:'Page',lcontrol:'Service',lentity:'Item',ldatabase:'DB',interaction:'Flow',iref:'Login',tline:'Signal'}[kind];
 let r;if(kind==='fragment'){r={svg:'<rect x="0" y="0" width="120" height="60" fill="#fff" stroke="#1f2937"/><path d="M0 16H36L42 8V0" fill="#eef3fa" stroke="#1f2937"/><text x="6" y="12" font-size="11" font-weight="600">alt</text><line x1="0" y1="38" x2="120" y2="38" stroke="#1f2937" stroke-dasharray="5 3"/>',vb:[-4,-4,128,68]}}
 else{const n=SOFT.newNode(kind,0,0,nm!=null?nm:undefined);if(kind==='entity')n.props.cols=[{name:'id',type:'INT',pk:1},{name:'name',type:'TEXT'}];if(kind==='class')n.props.attrs='- id: int';if(kind==='tline'){n.props.tmax=16;n.props.changes='0:Idle,6:Busy,12:Idle'}if(SOFT.NK[kind].container){n.w=160;n.h=100}d.nodes.push(n);r=SOFT.render(d,{})}
 const [x,y,w,h]=r.vb;return THUMB[key]=`<svg viewBox="${x+20} ${y+20} ${w-40} ${h-40}" preserveAspectRatio="xMidYMid meet">${r.svg}</svg>`}
function edgeThumb(d,kind){const K=SOFT.EK[kind];let mS=K.s,mE=K.e;if(kind==='rel'){if(d.notation==='crowsfoot'){mS='cf:1';mE='cf:0..*'}else if(d.notation==='idef1x'){mE='dot'}else mS=mE=null}const [a,ba]=mS?SOFT.marker(mS,4,9,-1,0):['',0];const [b,bb]=mE?SOFT.marker(mE,52,9,1,0):['',0];
 return `<svg viewBox="0 0 56 18"><line x1="${4+ba}" y1="9" x2="${52-bb}" y2="9" stroke="#1f2937" stroke-width="1.3"${K.d?` stroke-dasharray="${K.d}"`:''}/>${a}${b}</svg>`}
function palette(){const d=dg();const t=SOFT.TYPES[d.type];let h=`<h3>Shapes</h3><div class="pg">`+t.nodes.map(k=>`<button class="pi" draggable="true" data-k="${k}" title="${esc(SOFT.NK[k].label||k)}">${thumb(d.type,k)}<span>${esc(SOFT.NK[k].label||k.replace(/^\w/,c=>c.toUpperCase()))}</span></button>`).join('')+'</div>';
 h+=`<h3>${t.special==='sequence'?'Messages':'Lines'}</h3>`+t.edges.map(k=>`<button class="pl${ST.conn&&ST.conn.kind===k?' on':''}" data-ek="${k}" title="Click, then drag from one shape to another">${edgeThumb(d,k)}<span>${esc(SOFT.EK[k].label)}</span></button>`).join('');
 h+=`<p style="font-size:11.5px;color:var(--dim);margin:12px 2px 0;line-height:1.5">${t.special==='sequence'?'Pick a message, then drag from one lifeline to another. A selected message gets the new one after it.':'Click a shape to add it, or drag it onto the page. Pick a line, then drag from one shape to another, or drag the blue dot of a selected shape.'}</p>`;
 $('#pal').innerHTML=h;
 $$('#pal .pi').forEach(b=>{b.onclick=()=>{const r=$('#cv').getBoundingClientRect();addNode(b.dataset.k,(r.width/2-ST.view.ox)/ST.view.s-40+Math.random()*40,(r.height/2-ST.view.oy)/ST.view.s-30+Math.random()*40)};b.ondragstart=e=>e.dataTransfer.setData('text/cesoft-kind',b.dataset.k)});
 $$('#pal .pl').forEach(b=>b.onclick=()=>{ST.conn=ST.conn&&ST.conn.kind===b.dataset.ek?null:{kind:b.dataset.ek};ST.lastEdge[d.type]=b.dataset.ek;$('#cv').classList.toggle('conn',!!ST.conn);palette();hint()})}
function hint(){const d=dg();$('#hint').textContent=ST.conn?`Drag from one shape to another to draw: ${SOFT.EK[ST.conn.kind].label}. Esc stops.`:(d.nodes.length?'Drag to move · drag the page to pan · wheel to zoom · Shift+drag to select several':'Add shapes from the left, or open an example.')}
function addNode(kind,x,y){const d=dg();snap();const n=SOFT.newNode(kind,Math.round(x/10)*10,Math.round(y/10)*10);if(kind==='fragment'){const m=d.edges.length;n.props.first=Math.max(1,m-1);n.props.last=Math.max(1,m)}if(SOFT.TYPES[d.type].special==='timing'){n.y=Math.max(0,...d.nodes.filter(q=>q.kind==='tline').map(q=>q.y+200))}
 if(SOFT.TYPES[d.type].special==='sequence'&&SOFT.NK[kind].seq){n.x=Math.max(40,...d.nodes.filter(q=>SOFT.NK[q.kind].seq).map(q=>q.x+170))}d.nodes.push(n);ST.sel=new Set([n.id]);full();focusName()}
function focusName(){setTimeout(()=>{const i=$('#insp [data-f="name"]');if(i){i.focus();i.select&&i.select()}},30)}
/* ---------- inspector ---------- */
function insp(){const d=dg();const el=$('#insp');const ids=[...ST.sel];
