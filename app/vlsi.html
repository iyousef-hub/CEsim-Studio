<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="fonts/fonts.css" rel="stylesheet"><title>CEsim VLSI</title>
<style>
:root{--bg:#e9edf2;--panel:#f7f8fa;--line:#cdd3dc;--text:#1b2230;--dim:#5e6979;--hover:#e1e7ef;--accent:#185fa5;--font:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:13px/1.35 var(--font);overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr 28px;height:100%}
#top{display:flex;flex-wrap:wrap;row-gap:2px;align-items:center;gap:2px;padding:4px 10px;min-height:44px;background:var(--panel);border-bottom:1px solid var(--line);user-select:none}
.logo{flex:none;width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 10px var(--mono);margin-right:6px}
#docname{flex:none;font-weight:600;margin-right:10px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;padding:3px 5px;border-radius:3px}#docname:hover{background:var(--hover)}
.tb{flex:none;height:30px;min-width:30px;padding:0 9px;border:1px solid transparent;border-radius:4px;background:none;color:var(--text);cursor:pointer;font:12.5px var(--font);white-space:nowrap}
.tb:hover{background:var(--hover);border-color:var(--line)}.tb.pri{background:var(--accent);color:#fff}.tb.on{background:#dce9f8;border-color:#9dbde4}.tb.pri.on{background:#0f3f73;color:#fff;border-color:#0f3f73}.tb kbd{font:10.5px var(--mono);color:var(--dim);margin-left:4px}
.sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 6px}
#main{display:grid;grid-template-columns:190px minmax(0,1fr) 300px;min-height:0}
#pal{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:6px 8px 14px;user-select:none}
h3{font:600 11px var(--font);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:10px 2px 6px}
.ly{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:none;border-radius:5px;padding:4px 6px;cursor:pointer;font:12.5px var(--font);color:var(--text);text-align:left}.ly:hover{background:#fff;border-color:#dde2e9}.ly.on{background:#dce9f8;border-color:#9dbde4}
.sw{flex:none;width:22px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}.ly kbd{margin-left:auto;font:10.5px var(--mono);color:var(--dim)}.eye{flex:none;border:none;background:none;cursor:pointer;color:var(--dim);font-size:12px;padding:0 2px}.eye.off{opacity:.35}
.lrow{display:flex;align-items:center}
#stage{position:relative;overflow:hidden;background:#11151c}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;outline:none}
#hint{position:absolute;left:12px;top:10px;background:rgba(15,22,36,.85);color:#dbe4f0;border-radius:6px;padding:6px 10px;font-size:12px;pointer-events:none;max-width:65%}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}#zoom button{width:30px;height:30px;border:1px solid #2b3648;background:#162033;color:#dbe4f0;border-radius:5px;cursor:pointer;font-size:15px}
#side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:4px 12px 16px}
.card{background:#fff;border:1px solid #dde2e9;border-radius:8px;padding:9px 10px;margin-bottom:8px}.sub{font-size:11.5px;color:var(--dim)}
.prob{display:flex;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12px;line-height:1.4}.prob:hover{background:#fff}.prob i{font-style:normal;flex:none;color:#c62828}
table.tt{border-collapse:collapse;font:12px var(--mono);margin-top:6px}table.tt th,table.tt td{border:1px solid #dde2e9;padding:3px 9px;text-align:center}table.tt th{background:#f1f4f8;font-family:var(--font);font-weight:600}table.tt td.o{font-weight:600}table.tt tr.cur td{background:#fff4c2}table.tt tr{cursor:pointer}
.inbtn{display:inline-flex;align-items:center;gap:6px;margin:3px 8px 3px 0;font:12px var(--mono)}.inbtn button{width:30px;height:24px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;font:600 12px var(--mono)}.inbtn button.one{background:#ffd84d;border-color:#c9a400}
.trow{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;border-radius:4px;font:12px var(--mono);cursor:pointer}.trow:hover{background:#fff}.trow span{color:var(--dim);font-family:var(--font)}
#xs{width:100%;height:150px;display:block;border-radius:6px;background:#fff;border:1px solid #dde2e9}
.btn{height:26px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text);cursor:pointer;font:12px var(--font)}.btn:hover{background:var(--hover)}
#statusbar{display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden}#status b{color:var(--text)}#status.err b{color:#b3261e}#status.ok b{color:#1f7a37}#coord{margin-left:auto;font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#1b2230;color:#fff;padding:9px 14px;border-radius:6px;font-size:12.5px;z-index:90;max-width:70vw}.toast.warn{background:#8a3a00}
.menu{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(20,30,50,.18);padding:4px;min-width:250px;display:flex;flex-direction:column}
.menu button{display:flex;justify-content:space-between;gap:20px;border:none;background:none;text-align:left;padding:7px 10px;font:12.5px var(--font);border-radius:4px;cursor:pointer;color:var(--text)}.menu button:hover{background:#eaf3ff}.menu button span{color:var(--dim)}.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.ov{position:fixed;inset:0;background:rgba(15,20,30,.35);display:grid;place-items:center;z-index:70}
.mdl{background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(760px,92vw);max-height:86vh;display:flex;flex-direction:column}.mdl .mh2{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}.mdl .mb{padding:6px 18px 16px;overflow:auto;font-size:13px;line-height:1.55}.mdl h4{margin:12px 0 4px;font-size:13px}
.lblin{position:absolute;z-index:20;height:26px;font:13px var(--mono);border:2px solid var(--accent);border-radius:4px;padding:0 5px;width:110px}
.edit{height:24px;font:13px var(--font);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}[hidden]{display:none!important}
</style></head>
<body><div id="app">
<div id="top">
 <div class="logo">CE</div><span id="docname" title="Click to rename">cell</span>
 <button class="tb" id="bFile">File ▾</button><button class="tb" id="bEx">Examples ▾</button><button class="tb" id="bUndo" title="Undo (Ctrl+Z)">↶</button><button class="tb" id="bRedo" title="Redo (Ctrl+Y)">↷</button><div class="sep"></div>
 <button class="tb" id="tSel" data-tool="select" title="Select an area to move, copy or delete (S)">Select<kbd>S</kbd></button><button class="tb on" id="tPaint" data-tool="paint" title="Paint rectangles of the chosen layer (P)">Paint<kbd>P</kbd></button><button class="tb" id="tErase" data-tool="erase" title="Erase the chosen layer; hold Shift to erase every layer (E)">Erase<kbd>E</kbd></button>
 <button class="tb" id="tCont" data-tool="contact" title="Place a contact: metal 1 to poly or diffusion (C)">Contact<kbd>C</kbd></button><button class="tb" id="tVia" data-tool="via" title="Place a via: metal 1 to metal 2 (U)">Via<kbd>U</kbd></button><button class="tb" id="tVia2" data-tool="via2" title="Place a via 2: metal 2 to metal 3 (V)">Via 2<kbd>V</kbd></button><button class="tb" id="tLabel" data-tool="label" title="Name a wire: VDD, GND, inputs and outputs (T)">Label<kbd>T</kbd></button><button class="tb" id="tCut" data-tool="cut" title="Choose where the cross-section is cut (K)">Cross-section<kbd>K</kbd></button><div class="sep"></div>
 <button class="tb pri" id="bSim" title="Show logic values on the wires">Simulate</button><button class="tb" id="bRef">Reference</button>
</div>
<div id="main">
 <div id="pal"></div>
 <div id="stage"><canvas id="cv" tabindex="0" aria-label="Layout"></canvas><div id="hint" hidden></div><div id="zoom"><button id="zIn" title="Zoom in">+</button><button id="zOut" title="Zoom out">−</button><button id="zFit" title="Fit">⤢</button></div></div>
 <div id="side"></div>
</div>
<div id="statusbar"><span id="status"><b>Ready.</b></span><span id="stats"></span><span id="coord"></span></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const N=window.cesimNative;const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const COLORS={nwell:'#5c7a3a',ndiff:'#2fbf4a',pdiff:'#c8902f',poly:'#e0443a',m1:'#4f8cf0',m2:'#b65fe0',m3:'#e3b341',contact:'#111',via:'#555',via2:'#6b5a2a'};
const ALPHA={nwell:.30,ndiff:.75,pdiff:.75,poly:.78,m1:.55,m2:.50,m3:.42,contact:1,via:1,via2:1};
const KEYS={nwell:'1',ndiff:'2',pdiff:'3',poly:'4',m1:'5',m2:'6',m3:'7'};
const ST={L:new VL.Layout(),name:'cell',filePath:null,tool:'paint',layer:'poly',hidden:new Set(),view:{s:12,ox:40,oy:40},sel:null,drag:null,undo:[],redo:[],ex:null,drc:[],sim:false,inputs:{},cutY:null,hover:null,note:'',showDrc:true};
const cv=$('#cv'),cx=cv.getContext('2d');
/* ---------- view ---------- */
function size(){const r=cv.getBoundingClientRect();const d=devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);draw()}
new ResizeObserver(size).observe(cv);
const W2S=(x,y)=>[ST.view.ox+x*ST.view.s,ST.view.oy+y*ST.view.s];
const S2W=(px,py)=>[(px-ST.view.ox)/ST.view.s,(py-ST.view.oy)/ST.view.s];
const cell=(px,py)=>{const[x,y]=S2W(px,py);return[Math.floor(x),Math.floor(y)]};
function evPos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function fit(){const r=cv.getBoundingClientRect();const b=ST.L.bounds()||[0,0,40,30];const m=4;const w=b[2]-b[0]+2*m,h=b[3]-b[1]+2*m;const s=Math.max(2,Math.min(48,Math.min(r.width/w,r.height/h)));ST.view={s,ox:(r.width-(b[2]-b[0])*s)/2-b[0]*s,oy:(r.height-(b[3]-b[1])*s)/2-b[1]*s};draw()}
function zoomAt(f,px,py){const r=cv.getBoundingClientRect();if(px==null){px=r.width/2;py=r.height/2}const v=ST.view;const ns=Math.max(1.5,Math.min(80,v.s*f));const k=ns/v.s;ST.view={s:ns,ox:px-(px-v.ox)*k,oy:py-(py-v.oy)*k};draw()}
/* ---------- analysis ---------- */
let rectCache=null;
function analyse(){rectCache=null;ST.ex=VL.extract(ST.L);ST.drc=VL.drc(ST.L,ST.ex);for(const n of ST.ex.inputs)if(!(n in ST.inputs))ST.inputs[n]=0;for(const k of Object.keys(ST.inputs))if(!ST.ex.inputs.includes(k))delete ST.inputs[k];ST.simRes=VL.simulate(ST.ex,ST.inputs);ST.tt=ST.ex.inputs.length<=6?VL.truthTable(ST.ex):null;updStatus()}
function rectsOf(l){if(!rectCache)rectCache={};if(!rectCache[l])rectCache[l]=VL.rects(ST.L,l);return rectCache[l]}
/* ---------- drawing ---------- */
function draw(){const d=devicePixelRatio||1;cx.setTransform(d,0,0,d,0,0);const r=cv.getBoundingClientRect();cx.fillStyle='#11151c';cx.fillRect(0,0,r.width,r.height);const s=ST.view.s;
 // grid
 const[gx0,gy0]=cell(0,0),[gx1,gy1]=cell(r.width,r.height);if(s>=5){cx.fillStyle='rgba(255,255,255,.10)';for(let y=gy0;y<=gy1+1;y++)for(let x=gx0;x<=gx1+1;x++){const[a,b]=W2S(x,y);cx.fillRect(a-.5,b-.5,1,1)}}
 if(s>=3){cx.strokeStyle='rgba(255,255,255,.06)';cx.lineWidth=1;cx.beginPath();for(let x=Math.ceil(gx0/10)*10;x<=gx1+1;x+=10){const[a]=W2S(x,0);cx.moveTo(a+.5,0);cx.lineTo(a+.5,r.height)}for(let y=Math.ceil(gy0/10)*10;y<=gy1+1;y+=10){const[,b]=W2S(0,y);cx.moveTo(0,b+.5);cx.lineTo(r.width,b+.5)}cx.stroke()}
 const simCol=ST.sim&&ST.simRes;const nv=simCol?ST.simRes.nodeVal:null;
 for(const l of['nwell','ndiff','pdiff','poly','m1','m2','m3']){if(ST.hidden.has(l))continue;cx.globalAlpha=ALPHA[l];cx.fillStyle=COLORS[l];for(const[x,y,w,h]of rectsOf(l)){const[a,b]=W2S(x,y);cx.fillRect(a,b,w*s,h*s)}
  cx.globalAlpha=1;if(l==='nwell'){cx.strokeStyle='#8fb35a';cx.setLineDash([5,4]);cx.lineWidth=1.2;outline('nwell');cx.setLineDash([])}
  if(l==='poly'&&s>=4){// transistor channels hatched
   cx.save();cx.strokeStyle='rgba(0,0,0,.55)';cx.lineWidth=1;for(const k of ST.L.L.poly){const[x,y]=VL.XY(k);const t=VL.channelType(ST.L,x,y);if(!t)continue;const[a,b]=W2S(x,y);cx.beginPath();cx.moveTo(a,b+s);cx.lineTo(a+s,b);cx.stroke()}cx.restore()}
  if((l==='m1'||l==='m2'||l==='m3')&&s>=3){cx.strokeStyle=l==='m1'?'#8fb6ff':l==='m2'?'#d7a2f2':'#f3d27a';cx.lineWidth=1;outline(l)}}
 // logic values: tint wires
 if(simCol){cx.globalAlpha=.5;for(const l of['ndiff','pdiff','poly','m1','m2','m3']){if(ST.hidden.has(l))continue;for(const k of ST.L.L[l]){const[x,y]=VL.XY(k);const n=ST.ex.nodeAt(x,y);if(n==null)continue;const v=nv.get(n);const[a,b]=W2S(x,y);cx.fillStyle=v===1?'#ffe14d':v===0?'#1b2a52':v==='X'?'#ff2d55':'rgba(0,0,0,0)';if(v===undefined||v==='Z')continue;cx.fillRect(a,b,s,s)}}cx.globalAlpha=1}
 for(const l of['contact','via','via2']){if(ST.hidden.has(l))continue;for(const[x,y,w,h]of rectsOf(l)){const[a,b]=W2S(x,y);cx.fillStyle=l==='contact'?'#0b0b0b':l==='via'?'#3a3a3a':'#4a3d12';cx.fillRect(a,b,w*s,h*s);cx.strokeStyle=l==='contact'?'#fff':l==='via'?'#e8c8ff':'#ffe08a';cx.lineWidth=1;cx.beginPath();cx.moveTo(a+2,b+2);cx.lineTo(a+w*s-2,b+h*s-2);cx.moveTo(a+w*s-2,b+2);cx.lineTo(a+2,b+h*s-2);cx.stroke()}}
 // labels
 cx.font=`600 ${Math.max(10,Math.min(16,s*1.1))}px IBM Plex Mono`;cx.textBaseline='middle';for(const lb of ST.L.labels){const[a,b]=W2S(lb.x+.5,lb.y+.5);let t=lb.text;if(simCol&&ST.simRes.values[lb.text]!=null)t+=' = '+ST.simRes.values[lb.text];const w=cx.measureText(t).width;cx.fillStyle='rgba(255,255,255,.9)';cx.fillRect(a-3,b-9,w+12,18);cx.fillStyle='#111';cx.beginPath();cx.arc(a,b,2.5,0,7);cx.fill();cx.fillText(t,a+6,b+1)}
 // DRC
 if(ST.showDrc)for(const q of ST.drc){const[x0,y0,x1,y1]=q.box;const[a,b]=W2S(x0,y0);cx.strokeStyle='#ff4fd8';cx.lineWidth=2;cx.setLineDash([4,3]);cx.strokeRect(a-2,b-2,(x1-x0)*s+4,(y1-y0)*s+4);cx.setLineDash([])}
 // cut line
 if(ST.cutY!=null){const[,b]=W2S(0,ST.cutY+.5);cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.setLineDash([8,4]);cx.beginPath();cx.moveTo(0,b);cx.lineTo(r.width,b);cx.stroke();cx.setLineDash([]);cx.fillStyle='#fff';cx.font='600 12px IBM Plex Sans';cx.fillText('A',6,b-9);cx.fillText("A'",r.width-20,b-9)}
 // selection and drag preview
 const sel=ST.sel;if(sel){const[a,b]=W2S(sel[0]+(ST.drag&&ST.drag.kind==='move'?ST.drag.dx:0),sel[1]+(ST.drag&&ST.drag.kind==='move'?ST.drag.dy:0));cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.setLineDash([5,4]);cx.strokeRect(a,b,(sel[2]-sel[0])*s,(sel[3]-sel[1])*s);cx.setLineDash([])}
 const dg=ST.drag;if(dg&&(dg.kind==='paint'||dg.kind==='erase'||dg.kind==='select')){const[x0,y0,x1,y1]=box(dg.a,dg.b);const[a,b]=W2S(x0,y0);cx.fillStyle=dg.kind==='paint'?COLORS[ST.layer]:dg.kind==='erase'?'#ff3b30':'#fff';cx.globalAlpha=dg.kind==='select'?.08:.45;cx.fillRect(a,b,(x1-x0)*s,(y1-y0)*s);cx.globalAlpha=1;cx.strokeStyle=cx.fillStyle;cx.lineWidth=1.5;cx.strokeRect(a,b,(x1-x0)*s,(y1-y0)*s);cx.fillStyle='#fff';cx.font='12px IBM Plex Mono';cx.fillText(`${x1-x0} × ${y1-y0} λ`,a+(x1-x0)*s+6,b+(y1-y0)*s+10)}
 // hover cell
 const h=ST.hover;if(h&&!dg){const[a,b]=W2S(h[0],h[1]);cx.strokeStyle='rgba(255,255,255,.8)';cx.lineWidth=1;if(ST.tool==='contact'||ST.tool==='via'||ST.tool==='via2')cx.strokeRect(a-s,b-s,4*s,4*s);else cx.strokeRect(a,b,s,s)}
 drawXs()}
function outline(l){const S=ST.L.L[l];const s=ST.view.s;cx.beginPath();for(const k of S){const[x,y]=VL.XY(k);const[a,b]=W2S(x,y);if(!S.has(VL.K(x,y-1))){cx.moveTo(a,b+.5);cx.lineTo(a+s,b+.5)}if(!S.has(VL.K(x,y+1))){cx.moveTo(a,b+s-.5);cx.lineTo(a+s,b+s-.5)}if(!S.has(VL.K(x-1,y))){cx.moveTo(a+.5,b);cx.lineTo(a+.5,b+s)}if(!S.has(VL.K(x+1,y))){cx.moveTo(a+s-.5,b);cx.lineTo(a+s-.5,b+s)}}cx.stroke()}
const box=(a,b)=>[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[0],b[0])+1,Math.max(a[1],b[1])+1];
/* ---------- cross-section ---------- */
function drawXs(){const c=$('#xs');if(!c)return;const r=c.getBoundingClientRect();const d=devicePixelRatio||1;if(c.width!==Math.round(r.width*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d)}const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,r.width,r.height);
 if(ST.cutY==null){g.fillStyle='#5e6979';g.font='12px IBM Plex Sans';g.textAlign='center';g.fillText('Choose Cross-section (K), then click a row',r.width/2,r.height/2);g.textAlign='left';return}
 const b=ST.L.bounds()||[0,0,30,30];const x0=b[0]-2,x1=b[2]+2;const cols=VL.section(ST.L,ST.cutY,x0,x1);const k=r.width/(x1-x0);const X=x=>(x-x0)*k;
 const yS=92,H=r.height;// silicon surface at yS
 g.fillStyle='#d9d4c7';g.fillRect(0,yS,r.width,H-yS);// p substrate
 for(const c2 of cols){const a=X(c2.x);if(c2.nwell){g.fillStyle='#b8cf98';g.fillRect(a,yS,k+.5,38)}}
 for(const c2 of cols){const a=X(c2.x);if((c2.ndiff||c2.pdiff)&&!c2.gate){g.fillStyle=c2.ndiff?'#2fbf4a':'#c8902f';g.fillRect(a,yS,k+.5,10)}}
 // oxide: thick field oxide where no active area, thin under gates
 for(const c2 of cols){const a=X(c2.x);const act=c2.ndiff||c2.pdiff;if(!act){g.fillStyle='#eef3f7';g.fillRect(a,yS-8,k+.5,8)}else if(c2.gate){g.fillStyle='#eef3f7';g.fillRect(a,yS-2,k+.5,2)}}
 for(const c2 of cols){const a=X(c2.x);const act=c2.ndiff||c2.pdiff;if(c2.poly){g.fillStyle='#e0443a';g.fillRect(a,act?yS-12:yS-18,k+.5,10)}}
 g.fillStyle='rgba(220,230,240,.55)';g.fillRect(0,yS-44,r.width,36);// insulating glass between layers (simplified)

function showRef(){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="mdl" role="dialog" aria-label="Reference"><div class="mh2"><b>VLSI reference</b><button class="btn" id="refX">Close</button></div><div class="mb">
<h4>Layers and λ</h4><p>A chip is drawn as overlapping layers on a grid. One grid square is λ (lambda), half the smallest feature of the process; every rule is written in λ so a design can move to a smaller process. Here λ = 0.3 µm when you export.</p>
<h4>Transistors</h4><p>Wherever red poly crosses green n diffusion there is an nMOS transistor; across brown p diffusion, a pMOS. P diffusion must sit inside an n-well. The poly is the gate; the diffusion on each side is the source and drain. W is the gate's width across the diffusion, L its length along the current.</p>
<h4>Wires</h4><p>Metal 1 carries most wires and the power rails. A contact joins metal 1 to poly or diffusion; a via joins metal 1 and metal 2. Wires on different layers cross without touching.</p>
<h4>Labels and simulation</h4><p>Name the power wires VDD and GND, then name the inputs and outputs. Wires that only reach gates are inputs; wires that reach a source or drain are outputs. Simulate colours the wires: yellow 1, dark blue 0, red a conflict. The truth table lists every input combination and names the gate when it recognises it.</p>
<h4>Design rules</h4><p>The Check list shows every broken rule: shapes too narrow or too close, a gate that does not reach past the diffusion, contacts of the wrong size, p diffusion too close to the edge of its n-well. Click a problem to zoom to it.</p>
<h4>Cross-section</h4><p>Press K and click a row: the panel shows the chip cut along that row, with the substrate, n-well, diffusion, oxide, poly, contacts and metal.</p>
<h4>Output</h4><p>File exports GDSII and CIF (the layout formats chip makers use), a SPICE netlist of the extracted transistors, the layout as .MSK with its inputs set as clocks and its outputs ready to watch, the transistors as a .sch schematic with a button on every input and a lamp on every output, and a picture. Open reads .MSK layouts too, with up to three metal layers.</p>
<h4>Keys</h4><p>S select · P paint · E erase (Shift: all layers) · C contact · U via · T label · K cross-section · 1–6 layers · Ctrl+D duplicate · Delete clear selection · Ctrl+Z undo · wheel zoom · right or middle drag to move the view</p></div></div>`;document.body.appendChild(o);o.onclick=e=>{if(e.target===o||e.target.id==='refX')o.remove()}}
